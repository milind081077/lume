<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LUME</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a0f;--sf:#111118;--sf2:#18181f;
  --bd:#2a2a35;--bdhi:#3d3d52;
  --ac:#c9a84c;--ac2:#7c6bff;--ac3:#4cc9a8;
  --dng:#ff4c6b;--glow:rgba(201,168,76,.12);
  --tx:#e8e8f0;--tx2:#7a7a90;--tx3:#3a3a50;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Inter',-apple-system,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bd)}
::-webkit-scrollbar-track{background:transparent}

/* layout */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:238px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:54px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex-shrink:0;background:var(--sf)}
#page{flex:1;overflow-y:auto;padding:26px}

/* sidebar */
.logo{padding:18px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;border:1px solid var(--ac);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ac);flex-shrink:0;font-family:'Syne',sans-serif;font-weight:800}
.logo-name{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.logo-sub{font-family:'Inter',sans-serif;font-size:9px;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase;margin-top:1px;font-weight:500}
.sb-warn{margin:10px 10px 0;background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.28);padding:7px 11px;font-size:10px;color:var(--ac);display:flex;align-items:center;gap:7px}
.blink{width:5px;height:5px;background:var(--ac);flex-shrink:0;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-g{padding:13px 15px 3px;font-family:'Inter',sans-serif;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:8px}
.nav-g::after{content:'';flex:1;height:1px;background:var(--bd)}
.nav-item{width:100%;display:flex;align-items:center;gap:8px;padding:7px 14px;border:none;background:none;cursor:pointer;text-align:left;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--tx2);border-left:2px solid transparent;transition:all .14s;letter-spacing:0}
.nav-item:hover{background:var(--glow);color:var(--tx)}
.nav-item.active{background:rgba(201,168,76,.08);color:var(--ac);border-left-color:var(--ac)}
.nav-icon{font-size:10px;width:14px;text-align:center;flex-shrink:0}
.nav-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-badge{font-size:9px;border:1px solid var(--dng);color:var(--dng);padding:1px 5px;flex-shrink:0}
.sb-foot{padding:10px 14px 13px;border-top:1px solid var(--bd)}
.sf-hd{font-family:'Syne',sans-serif;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sf-hd::after{content:'';flex:1;height:1px;background:var(--bd)}
.sf-item{font-size:10px;color:var(--tx2);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* topbar */
.tb-bc{font-size:11px;color:var(--tx2);letter-spacing:.06em}
.tb-right{display:flex;align-items:center;gap:7px}
.tb-date{font-size:10px;color:var(--tx3);letter-spacing:.07em}

/* headings */
.h1{font-family:'Syne',sans-serif;font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--tx)}
.sub{font-family:'Inter',sans-serif;font-size:12px;color:var(--tx2);margin-top:4px;font-weight:400}

/* buttons */
.btn{padding:7px 14px;border:1px solid var(--bdhi);background:transparent;color:var(--tx2);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .16s}
.btn:hover{border-color:var(--ac);color:var(--ac);background:var(--glow)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0a0a0f;font-weight:500}
.btn.pri:hover{background:#e0bb62;border-color:#e0bb62}
.btn.dng:hover{border-color:var(--dng);color:var(--dng);background:rgba(255,76,107,.07)}
.btn.sm{padding:5px 10px;font-size:10px}
.btn.xs{padding:3px 8px;font-size:9px}

/* stat bar */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--bd);margin-bottom:22px}
.stat{padding:14px 17px;border-right:1px solid var(--bd)}
.stat:last-child{border-right:none}
.stat-n{font-family:'Syne',sans-serif;font-weight:700;font-size:22px}
.stat-l{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.14em;margin-top:3px}

/* filters */
.frow{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap;align-items:center}
.fin{background:var(--bg);border:1px solid var(--bdhi);color:var(--tx);font-family:'Inter',sans-serif;font-size:12px;padding:7px 11px;outline:none;transition:border-color .16s;flex:1;min-width:140px}
.fin:focus{border-color:var(--ac)}
.fsel{background:var(--bg);border:1px solid var(--bdhi);color:var(--tx);font-family:'Inter',sans-serif;font-size:12px;padding:7px 11px;outline:none;cursor:pointer}
.fsel:focus{border-color:var(--ac)}
.fchip{padding:4px 10px;border:1px solid var(--bd);background:var(--sf2);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;color:var(--tx2);cursor:pointer;transition:all .14s;letter-spacing:.04em;text-transform:uppercase}
.fchip:hover,.fchip.on{border-color:var(--ac);color:var(--ac);background:var(--glow)}

/* table */
.tbl-wrap{border:1px solid var(--bd);overflow:hidden}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:'Inter',sans-serif}
thead tr{background:var(--sf2)}
th{padding:9px 12px;text-align:left;font-family:'Syne',sans-serif;font-size:9px;font-weight:400;color:var(--tx3);text-transform:uppercase;letter-spacing:.18em;white-space:nowrap;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd)}
th:last-child{border-right:none}
td{padding:10px 12px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);vertical-align:middle;color:var(--tx2);font-family:'Inter',sans-serif}
td:last-child{border-right:none}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--sf2);color:var(--tx)}
.clip{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.hi{color:var(--tx)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border:1px solid;font-size:9px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.dot{width:4px;height:4px;flex-shrink:0}
.pri-chip{font-size:9px;padding:2px 6px;border:1px solid;letter-spacing:.06em;text-transform:uppercase;display:inline-block}

/* score */
.sc{display:flex;align-items:center;gap:7px}
.sc-t{flex:1;height:2px;background:var(--bd);min-width:40px}
.sc-f{height:100%}
.sc-n{font-size:10px;min-width:20px;text-align:right;font-weight:600;font-family:'JetBrains Mono',monospace}

/* ── PEEK PANEL ── */
.peek-bg{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px}
.peek{width:440px;max-width:92vw;max-height:88vh;background:var(--sf);border:1px solid var(--bdhi);box-shadow:0 24px 70px rgba(0,0,0,.8);display:flex;flex-direction:column;border-radius:2px;animation:peekIn .16s ease}
@keyframes peekIn{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.peek::-webkit-scrollbar{width:3px}
.peek-hd{padding:14px 18px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}
.peek-tag{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.18em;margin-bottom:3px}
.peek-title{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx)}
.peek-body{padding:14px 18px;flex:1;overflow-y:auto;min-height:0}
.peek-body::-webkit-scrollbar{width:3px}
.fg{margin-bottom:10px}
.fl{display:block;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.fi{width:100%;padding:7px 11px;background:var(--bg);border:1px solid var(--bdhi);color:var(--tx);font-family:'Inter',sans-serif;font-size:12px;outline:none;transition:border-color .16s}
.fi:focus{border-color:var(--ac)}
.fi-sel{width:100%;padding:7px 11px;background:var(--bg);border:1px solid var(--bdhi);color:var(--tx);font-family:'Inter',sans-serif;font-size:12px;outline:none;cursor:pointer}
.fi-sel:focus{border-color:var(--ac)}
.fi2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.drive-row{display:flex;gap:7px;align-items:center}
.drive-note{font-size:9px;color:var(--tx3);margin-top:3px;line-height:1.5}
.schema-box{background:var(--bg);border:1px solid var(--bd);padding:10px 13px;margin-top:12px}
.schema-hd{font-family:'Syne',sans-serif;font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.22em;margin-bottom:6px}
.schema-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);font-size:10px}
.schema-row:last-child{border-bottom:none}

/* ── CONFIRM DIALOG ── */
.cfm-bg{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.cfm-box{background:var(--sf);border:1px solid var(--dng);width:320px;padding:26px 24px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.8)}
.cfm-msg{font-size:12px;color:var(--tx);letter-spacing:.04em;margin-bottom:20px;line-height:1.6}
.cfm-btns{display:flex;gap:10px;justify-content:center}
.cfm-yes{padding:9px 22px;border:1px solid var(--dng);background:rgba(255,76,107,.12);color:var(--dng);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;transition:background .14s}
.cfm-yes:hover{background:rgba(255,76,107,.25)}
.cfm-no{padding:9px 22px;border:1px solid var(--bdhi);background:transparent;color:var(--tx2);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;transition:all .14s}
.cfm-no:hover{border-color:var(--tx2);color:var(--tx)}

/* ── JSON MODAL ── */
.json-bg{position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.json-box{background:var(--sf);border:1px solid var(--bdhi);width:580px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.7)}
.json-hd{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.json-title{font-family:'Syne',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.json-ta{flex:1;background:var(--bg);border:none;color:var(--ac3);font-family:'JetBrains Mono',monospace;font-size:10px;padding:14px;outline:none;resize:none;line-height:1.6;overflow-y:auto;min-height:200px}
.json-ft{padding:11px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}

/* PDF preview — proper report layout with letterhead, stats, alternating rows */
.pdf-bg{position:fixed;inset:0;z-index:600;background:#15151c;display:flex;flex-direction:column}
.pdf-bar{height:52px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 18px;flex-shrink:0}
.pdf-title{font-family:'Syne',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;flex:1;color:var(--tx)}
.pdf-body{flex:1;overflow:auto;padding:32px;display:flex;justify-content:center}
.pdf-sheet{background:#ffffff;color:#1a1a1a;width:100%;max-width:740px;box-sizing:border-box;padding:36px 38px;box-shadow:0 10px 50px rgba(0,0,0,.5);font-family:'Inter',sans-serif;min-height:fit-content;overflow:hidden}
.pdf-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:2px solid #1a1a1a;margin-bottom:22px}
.pdf-brand{display:flex;align-items:center;gap:9px}
.pdf-brand-mark{width:26px;height:26px;border:2px solid #c9a84c;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:#c9a84c}
.pdf-brand-name{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;letter-spacing:.18em;color:#1a1a1a}
.pdf-gen-date{font-family:'JetBrains Mono',monospace;font-size:10px;color:#888;letter-spacing:.04em}
.pdf-title-block{margin-bottom:20px}
.pdf-report-title{font-family:'Syne',sans-serif;font-weight:700;font-size:21px;letter-spacing:.01em;color:#1a1a1a;margin-bottom:5px}
.pdf-report-sub{font-family:'Inter',sans-serif;font-size:12px;color:#666;line-height:1.5}
.pdf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:0;border:1px solid #e2e2e2;margin-bottom:24px;border-radius:4px;overflow:hidden}
.pdf-stat-cell{padding:13px 16px;border-right:1px solid #e2e2e2;background:#fafafa}
.pdf-stat-cell:last-child{border-right:none}
.pdf-stat-v{font-family:'Syne',sans-serif;font-weight:700;font-size:19px;color:#1a1a1a}
.pdf-stat-l{font-family:'Inter',sans-serif;font-size:9px;color:#999;text-transform:uppercase;letter-spacing:.08em;margin-top:3px;font-weight:600}
.pdf-tbl{width:100%;table-layout:fixed;border-collapse:collapse;font-family:'Inter',sans-serif;font-size:10.5px}
.pdf-tbl th{background:#1a1a1a;color:#fff;padding:8px 10px;font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdf-tbl td{padding:8px 10px;border-bottom:1px solid #ececec;color:#2a2a2a;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;vertical-align:top;line-height:1.4}
.pdf-row-alt td{background:#fafafa}
.pdf-td-price{font-family:'JetBrains Mono',monospace;font-weight:600;color:#1a1a1a}
.pdf-td-date{font-family:'JetBrains Mono',monospace;color:#555}
.pdf-td-status{font-weight:600}
.pdf-td-priority{font-weight:500;color:#555}
.pdf-foot{display:flex;justify-content:space-between;margin-top:24px;padding-top:14px;border-top:1px solid #e2e2e2;font-family:'Inter',sans-serif;font-size:9px;color:#999;letter-spacing:.04em}
@media print{
  #app,#sidebar,#topbar,.toast-wrap{display:none!important}
  .pdf-bg{position:static!important;background:#fff!important}
  .pdf-bar{display:none!important}
  .pdf-body{display:block!important;position:static!important;overflow:visible!important;padding:0!important;background:#fff!important;justify-content:flex-start!important}
  .pdf-sheet{box-shadow:none!important;width:100%!important;max-width:100%!important;padding:0!important;box-sizing:border-box!important}
  .pdf-head{padding-bottom:10px!important;margin-bottom:14px!important}
  .pdf-brand-mark{width:20px!important;height:20px!important;font-size:10px!important}
  .pdf-brand-name{font-size:12px!important}
  .pdf-gen-date{font-size:8px!important}
  .pdf-title-block{margin-bottom:12px!important}
  .pdf-report-title{font-size:15px!important;margin-bottom:3px!important}
  .pdf-report-sub{font-size:9.5px!important}
  .pdf-stats{margin-bottom:14px!important}
  .pdf-stat-v{font-size:14px!important}
  .pdf-stat-l{font-size:7px!important}
  .pdf-stat-cell{padding:8px 10px!important}
  .pdf-tbl{font-size:7.8px!important;table-layout:fixed!important}
  .pdf-tbl th{padding:4px 5px!important;font-size:6.3px!important}
  .pdf-tbl td{padding:4px 5px!important;font-size:7.8px!important;word-break:break-word!important}
  .pdf-tbl th{background:#1a1a1a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pdf-row-alt td{background:#f5f5f5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pdf-stat-cell{background:#fafafa!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pdf-foot{margin-top:14px!important;padding-top:8px!important;font-size:7.5px!important}
  table, tr, td, th { page-break-inside: avoid; }
  @page{margin:10mm;size:A4 landscape}
}

/* pulse */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pcard{background:var(--sf);border:1px solid var(--bd);padding:13px 15px;display:flex;align-items:flex-start;gap:11px;transition:all .16s;position:relative;overflow:hidden;cursor:default}
.pcard:hover{border-color:var(--bdhi);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.pcard-bar{position:absolute;top:0;left:0;width:100%;height:2px}
.p-icon{width:28px;height:28px;border:1px solid var(--bdhi);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-family:'Syne',sans-serif;font-weight:700;color:var(--tx2)}
.p-meta{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.11em;margin-bottom:2px}
.p-name{font-size:11px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-due{font-size:9px;margin-top:3px;letter-spacing:.05em}

/* services */
.svc-sec{margin-bottom:24px}
.svc-cat-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.svc-cat-title{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.svc-cat-count{font-size:9px;color:var(--tx3);font-family:'JetBrains Mono',monospace}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:11px}
.svc-card{background:var(--sf);border:1px solid var(--bd);overflow:hidden;transition:all .16s;position:relative}
.svc-card:hover{border-color:var(--bdhi);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.svc-bar{position:absolute;left:0;top:0;bottom:0;width:2px}
.svc-top{padding:12px 15px 10px}
.svc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.svc-name{font-size:11px;color:var(--tx);letter-spacing:.04em;padding-right:6px}
.svc-pill{font-size:9px;color:var(--tx3);border:1px solid var(--bd);padding:2px 6px;letter-spacing:.05em;white-space:nowrap}
.svc-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:3px;font-size:10px;color:var(--tx2)}
.svc-hist{background:var(--sf2);border-top:1px solid var(--bd);padding:9px 15px}
.svc-hist-hd{font-family:'Syne',sans-serif;font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.2em;margin-bottom:6px}
.svc-hi{display:flex;align-items:flex-start;gap:7px;margin-bottom:6px}
.svc-hi-dot{width:4px;height:4px;background:var(--bdhi);margin-top:4px;flex-shrink:0}
.svc-hi-desc{font-size:10px;color:var(--tx2)}
.svc-hi-meta{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
.svc-hi-d,.svc-hi-w{font-size:9px;color:var(--tx3)}
.svc-hi-c{font-size:9px;font-weight:500;color:var(--ac)}
.svc-hist-empty{font-size:10px;color:var(--tx3);font-style:italic}
.log-btn{background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ac3);cursor:pointer;padding:0;letter-spacing:.06em;margin-top:6px;text-transform:uppercase}
.log-btn:hover{opacity:.65}
.svc-acts{display:flex;gap:7px;padding:8px 15px 10px;border-top:1px solid var(--bd);background:var(--sf2)}

/* ──────────────────────────────────────────────────────────────
   MOBILE / PWA RESPONSIVE LAYOUT  (breakpoint ≤ 768px)
   Collapses to a single-column layout with a fixed bottom nav.
   ────────────────────────────────────────────────────────────── */
#mobile-nav { display: none }

@media (max-width: 768px) {
  /* Hide the desktop sidebar */
  #sidebar { display: none !important }

  /* Full-width main column */
  #app { flex-direction: column }
  #main { width: 100%; flex: 1; min-height: 0 }

  /* Compact topbar */
  #topbar { padding: 0 12px; height: 48px }
  .tb-date { display: none }
  .tb-right .btn { padding: 4px 7px; font-size: 9px; letter-spacing: 0 }
  .tb-right { gap: 5px }
  .tb-bc { font-size: 10px }

  /* Page area — bottom padding clears the fixed nav */
  #page { padding: 12px 12px 72px }

  /* Fixed bottom navigation */
  #mobile-nav {
    display: flex;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--sf); border-top: 1px solid var(--bd);
    z-index: 300; height: 56px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #mobile-nav::-webkit-scrollbar { display: none }

  .mnav-item {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-width: 56px; padding: 6px 8px 4px;
    cursor: pointer; border: none; background: none; color: var(--tx2);
    font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 600;
    letter-spacing: .03em; text-transform: uppercase;
    border-top: 2px solid transparent; transition: all .14s;
    gap: 3px; flex-shrink: 0;
  }
  .mnav-item.active, .mnav-item:hover { color: var(--ac); border-top-color: var(--ac) }
  .mnav-icon { font-size: 16px; line-height: 1 }
  .mnav-lbl  { font-size: 8px; white-space: nowrap }

  /* Stat grid: 2 columns on mobile */
  .stats { grid-template-columns: repeat(2, 1fr) }
  .stat  { padding: 10px 12px }
  .stat-n { font-size: 18px }

  /* Tables: horizontal scroll */
  .tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch }
  table { font-size: 11px; min-width: 460px }
  th, td { padding: 7px 9px }

  /* Pulse / experience-cal grids: single column */
  .pgrid { grid-template-columns: 1fr }

  /* Section header: stack vertically */
  .sec-hd { flex-direction: column; gap: 10px; align-items: flex-start }
  .sec-hd > div:last-child { display: flex; flex-wrap: wrap; gap: 6px }

  /* Services: single column */
  .svc-grid { grid-template-columns: 1fr }

  /* Peek panel: bottom sheet on mobile */
  .peek-bg { padding: 0; align-items: flex-end }
  .peek {
    width: 100% !important; max-width: 100% !important;
    max-height: 92vh; border-radius: 16px 16px 0 0;
    animation: peekInMobile .2s ease;
  }
  @keyframes peekInMobile { from { transform: translateY(100%) } to { transform: translateY(0) } }

  /* Confirm dialog: bottom sheet */
  .cfm-bg { align-items: flex-end; padding: 0 }
  .cfm-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px }

  /* Calendar picker popup: anchored above bottom nav */
  .cal-popup { width: calc(100vw - 24px); left: 0; position: fixed;
               bottom: 60px; top: auto; transform: none }

  /* JSON modal: nearly full width */
  .json-box { width: calc(100vw - 24px); margin: 12px }

  /* Toasts: keep above bottom nav */
  .toast-wrap { bottom: 68px; right: 12px }

  /* h1: slightly smaller */
  .h1 { font-size: 15px }

  /* Experience calendar day cells: tighter */
  .rem-day  { min-height: 42px; padding: 3px }
  .rem-chip { font-size: 8px; padding: 1px 3px }

  /* PDF: smaller padding in preview */
  .pdf-body  { padding: 10px }
  .pdf-sheet { padding: 16px }
}

@media (max-width: 380px) {
  .mnav-lbl { display: none }
  .mnav-item { min-width: 44px }
  #page { padding: 10px 10px 72px }
}

/* iOS safe area (notch / home indicator) */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  #mobile-nav { padding-bottom: env(safe-area-inset-bottom) }
  @media (max-width: 768px) {
    #page { padding-bottom: calc(72px + env(safe-area-inset-bottom)) }
  }
}

// ============================================================
// HELPERS
// ============================================================
function dL(d){ if(!d) return null; return Math.round((new Date(d) - Date.now()) / 86400000); }
function fP(n){ if(n == null || n === '') return '--'; return '\u20B9' + Number(n).toLocaleString('en-IN'); }
function fD(d){ if(!d) return '--'; try{ return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; } }
function sCol(s){ return s >= 75 ? 'var(--dng)' : s >= 50 ? '#fb8c00' : s >= 25 ? 'var(--ac)' : 'var(--ac3)'; }

function calcScore(row, sch) {
  var s = 0;
  if(row.status === 'Critical') s += 50; else if(row.status === 'Pending') s += 25;
  if(row.priority === 'Urgent') s += 35; else if(row.priority === 'High') s += 20; else if(row.priority === 'Medium') s += 8;
  if(sch && sch.dateCol) {
    var d = dL(row[sch.dateCol]);
    if(d != null){ if(d < 0) s += 30; else if(d <= 2) s += 25; else if(d <= 7) s += 15; else if(d <= 30) s += 5; }
  }
  return Math.min(s, 100);
}

}

    var isDateCol = c === sch.dateCol;
    var isFileCol = c === 'Files' || c === 'Warranty' || c.toLowerCase().indexOf('file') >= 0;
    var cap = c; // capture for closure
    if(isFileCol) {
      body.appendChild(makeDriveField(cap, form[cap], function(v){ form[cap] = v; }));

      var dp = makeDatePicker(cap, form[cap] || '', function(v){ form[cap] = v; });

  // Status + Priority row
  var two = mkEl('div', 'fi2');

  // Save button
  var saveBtn = mkEl('button', 'btn pri', isNew ? '+ Add Entry' : 'Save Changes');
  saveBtn.style.cssText = 'width:100%;margin-top:6px';
  saveBtn.onclick = function() {
    var pk = sch.cols[0];
    var pkVal = (form[pk] || '').toString().trim();
    if(!pkVal) { toast('Please fill in: ' + pk, 'error'); return; }

    if(isNew) {
      var newRow = {id: Date.now(), status: form.status, priority: form.priority};
      sch.cols.forEach(function(c){ newRow[c] = form[c] || ''; });
      sch.rows.push(newRow);
      saveData();
      toast('Entry added', 'success');
    } else {
      sch.rows = sch.rows.map(function(r){
        if(r.id !== form.id) return r;
        var updated = {id: r.id, status: form.status, priority: form.priority};
        sch.cols.forEach(function(c){ updated[c] = form[c] || ''; });

    closePeek();
    renderPage();
    renderSidebar();

        closePeek();
        renderPage();
        renderSidebar();
        toast('Entry deleted', 'error');
      });
    };

  }

  panel.appendChild(body);
  ov.appendChild(panel);
  document.body.appendChild(ov);
}

function exportCSV(key) {
  var sch = SCHEMA[key];
  var allCols = sch.cols.concat(['status','priority']);
  var lines = [allCols.map(function(c){ return JSON.stringify(c); }).join(',')];
  sch.rows.forEach(function(row){
    lines.push(allCols.map(function(c){ return JSON.stringify(row[c] == null ? '' : String(row[c])); }).join(','));
  });
  var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'lume-' + sch.label.replace(/\s+/g,'-').toLowerCase() + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('CSV downloaded', 'success');
}

function showPDF(title, subtitle, summaryStats, cols, rows, colTypes) {
  S.pdfData = {title: title, subtitle: subtitle, summaryStats: summaryStats||[], cols: cols, rows: rows, colTypes: colTypes||[]};
  renderPDFPreview();
}

function exportPDF(key) {
  var sch = SCHEMA[key];
  var cols = sch.cols.concat(['Status','Priority']);
  var rows = sch.rows.map(function(row){
    return cols.map(function(c){
      var actualKey = (c==='Status')?'status':(c==='Priority')?'priority':c;
      var v = row[actualKey];
      if(v == null || v === '') return '--';
      if(actualKey === sch.priceCol) return fP(v);
      if(actualKey === sch.dateCol) return fD(v);
      return String(v);
    });
  });
  var total = sch.priceCol ? sch.rows.reduce(function(s,r){ return s+Number(r[sch.priceCol]||0); },0) : null;
  var crit = sch.rows.filter(function(r){ return r.status==='Critical'||r.priority==='Urgent'; }).length;
  var pending = sch.rows.filter(function(r){ return r.status==='Pending'; }).length;

  var stats = [{l:'Total Entries', v:sch.rows.length}];
  if(crit) stats.push({l:'Critical', v:crit});
  if(pending) stats.push({l:'Pending', v:pending});
  if(total != null) stats.push({l:'Total Value', v:fP(total)});

  var subtitle = sch.label + ' Tracker \u2014 exported from Lume on ' + new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});
  var colTypes = sch.cols.map(function(c){
    if(c === sch.priceCol) return 'price';
    if(c === sch.dateCol) return 'date';
    return 'text';
  }).concat(['status','priority']);

  showPDF('LUME \u2014 ' + sch.label, subtitle, stats, cols, rows, colTypes);
}

function openJSON(mode) {
  S.jsonModal = mode;
  renderJSON();
}
function renderJSON() {
  var existing = document.getElementById('json-overlay');
  if(existing) existing.parentNode.removeChild(existing);
  if(!S.jsonModal) return;
  var isExport = S.jsonModal === 'export';
  var ov = mkEl('div', 'json-bg'); ov.id = 'json-overlay';
  ov.onclick = function(e){ if(e.target===ov){ S.jsonModal=null; renderJSON(); } };
  var box = mkEl('div', 'json-box');
  var hd = mkEl('div', 'json-hd');
  hd.appendChild(mkEl('div', 'json-title', isExport ? 'Export JSON Backup' : 'Import JSON Backup'));
  var xBtn = mkEl('button', 'btn xs', '\u00D7'); xBtn.onclick = function(){ S.jsonModal=null; renderJSON(); };
  hd.appendChild(xBtn); box.appendChild(hd);
  var ta = mkEl('textarea', 'json-ta');
  ta.placeholder = isExport ? '' : 'Paste Lume JSON backup here...';
  if(isExport) {
    var bkp = {version:3, exported: new Date().toISOString(), trackers:{}, services:{cats:SVC.cats,items:SVC.items}, reminders:{events:REM_EVENTS,cats:REM_CATS}};
    SKEYS.forEach(function(k){ bkp.trackers[k] = SCHEMA[k].rows; });
    ta.value = JSON.stringify(bkp, null, 2);
    ta.readOnly = true;
  }
  box.appendChild(ta);
  var ft = mkEl('div', 'json-ft');
  if(isExport) {
    var copyBtn = mkEl('button', 'btn sm', 'Copy'); copyBtn.onclick = function(){ ta.select(); try{ navigator.clipboard.writeText(ta.value).then(function(){toast('Copied','success');}); }catch(e){ document.execCommand('copy'); toast('Copied','success'); } };
    var dlBtn = mkEl('button', 'btn pri sm', 'Download .json');
    dlBtn.onclick = function(){
      var blob = new Blob([ta.value],{type:'application/json;charset=utf-8;'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href=url; a.download='lume-backup-'+Date.now()+'.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },1000);
      toast('Backup downloaded','success');
    };
    ft.appendChild(copyBtn); ft.appendChild(dlBtn);
  } else {
    var cancelBtn = mkEl('button', 'btn sm', 'Cancel'); cancelBtn.onclick = function(){ S.jsonModal=null; renderJSON(); };
    var impBtn = mkEl('button', 'btn pri sm', 'Import');
    impBtn.onclick = function(){
      try {
        var d = JSON.parse(ta.value);
        if(!d.trackers) throw new Error('Invalid backup format');
        SKEYS.forEach(function(k){ if(d.trackers[k]) SCHEMA[k].rows = d.trackers[k]; });
        if(d.services){ SVC.cats=d.services.cats||SVC.cats; SVC.items=d.services.items||SVC.items; }
        if(d.reminders){ if(d.reminders.events&&Array.isArray(d.reminders.events)) REM_EVENTS=d.reminders.events; if(d.reminders.cats&&Array.isArray(d.reminders.cats)) REM_CATS=d.reminders.cats; }
        saveData();
        S.jsonModal=null; renderJSON(); renderPage(); renderSidebar();
        toast('Data imported successfully','success');
      } catch(e){ toast('Import failed: '+e.message,'error'); }
    };
    ft.appendChild(cancelBtn); ft.appendChild(impBtn);
  }
  box.appendChild(ft); ov.appendChild(box);
  document.body.appendChild(ov);
}

// GLOBAL PULSE
// ============================================================
function renderPulse() {
  var all = [];
  SKEYS.forEach(function(k){ SCHEMA[k].rows.forEach(function(r){ all.push({r:r,k:k,sch:SCHEMA[k],sc:calcScore(r,SCHEMA[k])}); }); });
  all.sort(function(a,b){ return b.sc - a.sc; });
  var seen = {}, top = [];
  all.forEach(function(i){ if(!seen[i.k]) seen[i.k]=0; if(seen[i.k]<2){ top.push(i); seen[i.k]++; } });

  var totCrit = all.filter(function(i){ return i.r.status==='Critical'||i.r.priority==='Urgent'; }).length;
  var pending = all.filter(function(i){ return i.r.status==='Pending'; }).length;
  var dueSoon = all.filter(function(i){ var d = i.sch.dateCol ? dL(i.r[i.sch.dateCol]) : null; return d != null && d >= 0 && d <= 7; }).length;

  var frag = document.createDocumentFragment();
  var secH = mkEl('div', 'sec-hd');
  var hL = mkEl('div');
  hL.appendChild(mkEl('div', 'h1', 'Overview'));
  hL.appendChild(mkEl('div', 'sub', 'Highest-criticality items across all ' + SKEYS.length + ' trackers'));
  secH.appendChild(hL); frag.appendChild(secH);

  var stats = mkEl('div', 'stats');
  [{l:'All Entries',v:all.length,c:'var(--ac)'},{l:'Critical',v:totCrit,c:'var(--dng)'},{l:'Pending',v:pending,c:'var(--ac)'},{l:'Due Soon',v:dueSoon,c:'#fb8c00'}]
  .forEach(function(s){
    var cell = mkEl('div', 'stat');
    var n = mkEl('div', 'stat-n', s.v); n.style.color = s.c;
    cell.appendChild(n); cell.appendChild(mkEl('div', 'stat-l', s.l));
    stats.appendChild(cell);
  });
  frag.appendChild(stats);

  var grid = mkEl('div', 'pgrid');
  top.slice(0,12).forEach(function(item){
    var sch = item.sch; var tc = sch.cols[0];
    var days = sch.dateCol ? dL(item.r[sch.dateCol]) : null;
    var bCol = item.sc >= 75 ? 'var(--dng)' : item.sc >= 50 ? '#fb8c00' : 'var(--ac)';
    var card = mkEl('div', 'pcard');
    var bar = mkEl('div', 'pcard-bar'); bar.style.background = bCol; card.appendChild(bar);
    var icon = mkEl('div', 'p-icon', sch.icon); card.appendChild(icon);
    var info = mkEl('div');
    info.style.cssText = 'flex:1;min-width:0';
    info.appendChild(mkEl('div', 'p-meta', sch.label));
    info.appendChild(mkEl('div', 'p-name', String(item.r[tc] || '--')));
    if(days != null) {
      var due = mkEl('div', 'p-due', days<0?'PAST DUE':days===0?'DUE TODAY':days+'D LEFT');
      due.style.color = days<0?'var(--dng)':days<=7?'#fb8c00':'var(--tx3)';
      info.appendChild(due);
    }
    card.appendChild(info);
    var right = mkEl('div'); right.style.cssText = 'display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0';
    right.appendChild(Badge(item.r.status));
    var sn = mkEl('span', null, item.sc); sn.style.cssText = 'font-size:11px;font-weight:500;color:'+sCol(item.sc)+';letter-spacing:.04em';
    right.appendChild(sn); card.appendChild(right);
    grid.appendChild(card);
  });
  frag.appendChild(grid);
  return frag;
}

function renderTracker(key) {
  var sch = SCHEMA[key];
  var q = (S.search[key] || '').toLowerCase();
  var sf = S.sf[key] || 'All';

  var filtered = sch.rows.filter(function(r){
    if(sf !== 'All' && r.status !== sf) return false;
    if(q) return sch.cols.some(function(c){ return String(r[c]||'').toLowerCase().indexOf(q) >= 0; });
    return true;
  }).sort(function(a,b){ return calcScore(b,sch) - calcScore(a,sch); });

  var total = sch.priceCol ? sch.rows.reduce(function(s,r){ return s+Number(r[sch.priceCol]||0); },0) : null;
  var crit = sch.rows.filter(function(r){ return r.status==='Critical'||r.priority==='Urgent'; }).length;

  var frag = document.createDocumentFragment();

  // Header
  var hd = mkEl('div', 'sec-hd');
  var hL = mkEl('div'); hL.style.display = 'flex'; hL.style.alignItems = 'center';
  var icon = mkEl('div', 't-icon', sch.icon); icon.style.borderColor = sch.col + '60';
  hL.appendChild(icon);
  var hTxt = mkEl('div');
  hTxt.appendChild(mkEl('div', 'h1', sch.label));
  hTxt.appendChild(mkEl('div', 'sub', sch.rows.length + ' entries' + (crit>0?' // '+crit+' critical':'') + (total?' // '+fP(total)+' tracked':'')));
  hL.appendChild(hTxt); hd.appendChild(hL);
  var btns = mkEl('div'); btns.style.cssText = 'display:flex;gap:6px;align-items:center';
  var addBtn = mkEl('button', 'btn pri sm', '+ Add');
  addBtn.onclick = function(){ openPeek(key, null); };
  var csvBtn = mkEl('button', 'btn sm', 'CSV \u2193');
  csvBtn.onclick = function(){ exportCSV(key); };
  var pdfBtn = mkEl('button', 'btn sm', 'PDF \u25A6');
  pdfBtn.onclick = function(){ exportPDF(key); };
  btns.appendChild(addBtn); btns.appendChild(csvBtn); btns.appendChild(pdfBtn);
  hd.appendChild(btns); frag.appendChild(hd);

  // Filters
  var frow = mkEl('div', 'frow');
  var searchInp = mkEl('input', 'fin');
  searchInp.type = 'text'; searchInp.value = S.search[key] || '';
  searchInp.placeholder = 'Search ' + sch.label.toLowerCase() + '...';
  searchInp.oninput = function(){ S.search[key] = searchInp.value; renderPage(); };
  frow.appendChild(searchInp);
  var sfSel = mkEl('select', 'fsel');
  ['All'].concat(Object.keys(STATUS)).forEach(function(st){
    var o = document.createElement('option'); o.value=st; o.textContent=st;
    if((S.sf[key]||'All')===st) o.selected=true;
    sfSel.appendChild(o);
  });
  sfSel.onchange = function(){ S.sf[key] = sfSel.value; renderPage(); };
  frow.appendChild(sfSel); frag.appendChild(frow);

  // Table
  var wrap = mkEl('div', 'tbl-wrap');
  var scroll = mkEl('div', 'tbl-scroll');
  var tbl = document.createElement('table');
  var thead = mkEl('thead'); var hr = mkEl('tr');
  sch.cols.forEach(function(c){ hr.appendChild(mkEl('th', null, c)); });
  hr.appendChild(mkEl('th', null, 'Status')); hr.appendChild(mkEl('th', null, 'Score'));
  thead.appendChild(hr); tbl.appendChild(thead);

  var tbody = mkEl('tbody');
  if(!filtered.length) {
    var eRow = mkEl('tr'); var eTd = mkEl('td', null, 'No entries');
    eTd.colSpan = sch.cols.length + 2;
    eTd.style.cssText = 'text-align:center;padding:30px;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase;font-size:10px';
    eRow.appendChild(eTd); tbody.appendChild(eRow);
  } else {
    filtered.forEach(function(row){
      var sc = calcScore(row, sch);
      var tr = mkEl('tr');
      if(sc >= 75) tr.style.background = 'rgba(255,76,107,.03)';
      else if(sc >= 50) tr.style.background = 'rgba(251,140,0,.02)';
      // Capture for closure

          if(d != null && d < 0) dv.style.color = 'var(--dng)';
          td.appendChild(dv);
          if(d != null) {

            ds.style.cssText = 'font-size:9px;margin-top:1px;text-transform:uppercase;color:' + (d<0?'var(--dng)':d<=7?'#fb8c00':'var(--tx3)');

        tr.appendChild(td);

      var statusTd = mkEl('td');

      statusTd.appendChild(badgeWrap); tr.appendChild(statusTd);
      var scoreTd = mkEl('td'); scoreTd.appendChild(ScoreBar(sc)); tr.appendChild(scoreTd);
      tbody.appendChild(tr);
    });

  tbl.appendChild(tbody); scroll.appendChild(tbl); wrap.appendChild(scroll);
  frag.appendChild(wrap);
  return frag;

  ki.oninput=function(){S.notionKey=ki.value;};keyG.appendChild(ki);
  frag.appendChild(keyG);

  var statusEl=mkEl('div');statusEl.style.minHeight='26px';statusEl.style.marginBottom='10px';frag.appendChild(statusEl);
  function setStatus(msg,type){
    statusEl.innerHTML='';if(!msg)return;
    var styles={success:'background:rgba(76,201,168,.08);color:var(--ac3);border-left:3px solid var(--ac3)',error:'background:rgba(255,76,107,.08);color:var(--dng);border-left:3px solid var(--dng)',info:'background:rgba(201,168,76,.08);color:var(--ac);border-left:3px solid var(--ac)'};
    var d=mkEl('div',null,msg);d.style.cssText='padding:8px 13px;font-size:11px;letter-spacing:.04em;'+(styles[type]||styles.info);statusEl.appendChild(d);
  }

  SKEYS.forEach(function(key){
    var sch=SCHEMA[key];
    var card=mkEl('div','n-card');
    var hd=mkEl('div','n-hd');
    var icon=mkEl('div','n-icon',sch.icon);icon.style.borderColor=sch.col+'80';icon.style.color=sch.col;hd.appendChild(icon);
    var info=mkEl('div');info.style.cssText='flex:1;min-width:0';
    info.appendChild(mkEl('div',null,sch.label));info.lastChild.style.cssText='font-size:11px;color:var(--tx);letter-spacing:.04em';
    var schemaPreview=Object.keys(sch.notion).slice(0,3).map(function(k){return k+':'+sch.notion[k];}).join(' / ');
    info.appendChild(mkEl('div',null,schemaPreview));info.lastChild.style.cssText='font-size:9px;color:var(--tx3);margin-top:2px;letter-spacing:.04em';
    hd.appendChild(info);
    var di=mkEl('input');di.type='text';di.value=S.notionIds[key]||'';di.placeholder='Database ID';
    di.style.cssText='width:165px;padding:6px 10px;background:var(--bg);border:1px solid var(--bdhi);color:var(--tx);font-family:JetBrains Mono,monospace;font-size:10px;outline:none;letter-spacing:.04em';
    di.oninput=function(){S.notionIds[key]=di.value;};hd.appendChild(di);card.appendChild(hd);

    var acts=mkEl('div','n-acts');
    var pushBtn=mkEl('button','btn sm');pushBtn.textContent='\u2191 Push ('+sch.rows.length+')';pushBtn.style.borderColor=sch.col;pushBtn.style.color=sch.col;
    pushBtn.onclick=function(){
      var dbId=S.notionIds[key];
      if(!S.notionKey||!dbId){setStatus('Add API key and database ID for '+sch.label,'info');return;}
      if(!sch.rows.length){setStatus('No entries to push for '+sch.label,'info');return;}
      pushBtn.disabled=true;pushBtn.textContent='Pushing...';
      var done=0,errs=0;
      var tc=sch.cols[0];var notionType=sch.notion[tc]||'Title';
      Promise.all(sch.rows.map(function(row){
        var props={};
        sch.cols.forEach(function(c){
          var v=row[c];var t=sch.notion[c];
          if(v==null||v==='')return;
          if(t==='Title')props[c]={title:[{text:{content:String(v)}}]};
          else if(t==='Number')props[c]={number:Number(v)||0};
          else if(t==='Date')props[c]={date:{start:String(v)}};
          else if(t==='URL')props[c]={url:String(v)};
          else if(t==='Phone')props[c]={phone_number:String(v)};
          else if(t==='Select')props[c]={select:{name:String(v)}};
          else props[c]={rich_text:[{text:{content:String(v).slice(0,2000)}}]};
        });
        props['Status']={select:{name:row.status||'Active'}};
        props['Priority']={select:{name:row.priority||'Medium'}};
        return fetch('https://api.notion.com/v1/pages',{method:'POST',headers:{Authorization:'Bearer '+S.notionKey,'Notion-Version':'2022-06-28','Content-Type':'application/json'},body:JSON.stringify({parent:{database_id:dbId},properties:props})})
        .then(function(r){return r.json().then(function(j){if(r.ok)done++;else{errs++;console.log('Notion error',j);}});})
        .catch(function(e){errs++;console.log('Push error',e);});
      })).then(function(){
        pushBtn.disabled=false;pushBtn.textContent='\u2191 Push ('+sch.rows.length+')';
        if(errs===0){setStatus('Pushed '+done+' entries to Notion: '+sch.label,'success');toast(done+' entries pushed','success');}
        else{setStatus('Pushed '+done+', '+errs+' errors. If blocked, use Copy JSON to push via Zapier/Make/Postman.','error');}
      });
    };
    acts.appendChild(pushBtn);

    var pullBtn=mkEl('button','btn sm','\u2193 Pull');
    pullBtn.onclick=function(){
      var dbId=S.notionIds[key];
      if(!S.notionKey||!dbId){setStatus('Add API key and database ID for '+sch.label,'info');return;}
      pullBtn.disabled=true;pullBtn.textContent='Pulling...';
      fetch('https://api.notion.com/v1/databases/'+dbId+'/query',{method:'POST',headers:{Authorization:'Bearer '+S.notionKey,'Notion-Version':'2022-06-28','Content-Type':'application/json'},body:JSON.stringify({page_size:100})})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(json){
        pullBtn.disabled=false;pullBtn.textContent='\u2193 Pull';
        var imported=(json.results||[]).map(function(page,idx){
          var row={id:Date.now()+idx,status:'Active',priority:'Medium'};
          sch.cols.forEach(function(c){
            var prop=page.properties&&page.properties[c];if(!prop)return;
            if(prop.title)row[c]=(prop.title[0]&&prop.title[0].plain_text)||'';
            else if(prop.rich_text)row[c]=(prop.rich_text[0]&&prop.rich_text[0].plain_text)||'';
            else if(prop.number!=null)row[c]=prop.number;
            else if(prop.date)row[c]=prop.date&&prop.date.start||'';
            else if(prop.url)row[c]=prop.url||'';
            else if(prop.phone_number)row[c]=prop.phone_number||'';
            else if(prop.select)row[c]=prop.select&&prop.select.name||'';
          });
          var sp=page.properties&&page.properties['Status'];if(sp&&sp.select)row.status=sp.select.name||'Active';
          var pp=page.properties&&page.properties['Priority'];if(pp&&pp.select)row.priority=pp.select.name||'Medium';
          return row;
        });
        if(!imported.length){setStatus('No pages found in Notion database','info');return;}
        var tc=sch.cols[0];
        var merged=sch.rows.concat(imported.filter(function(imp){return !sch.rows.some(function(e){return String(e[tc])===String(imp[tc]);});}));
        sch.rows=merged;saveData();renderPage();renderSidebar();
        setStatus('Pulled '+imported.length+' entries into '+sch.label,'success');toast(imported.length+' entries pulled','success');
      })
      .catch(function(e){pullBtn.disabled=false;pullBtn.textContent='\u2193 Pull';setStatus('Error: '+e.message,'error');});
    };
    acts.appendChild(pullBtn);

    var copyBtn=mkEl('button','btn sm','{ } JSON');
    copyBtn.onclick=function(){
      var dbId=S.notionIds[key]||'YOUR_DB_ID';
      var payload=sch.rows.map(function(row){
        var props={};
        sch.cols.forEach(function(c){
          var v=row[c];var t=sch.notion[c];if(v==null||v==='')return;
          if(t==='Title')props[c]={title:[{text:{content:String(v)}}]};
          else if(t==='Number')props[c]={number:Number(v)||0};
          else if(t==='Date')props[c]={date:{start:String(v)}};
          else if(t==='URL')props[c]={url:String(v)};
          else if(t==='Phone')props[c]={phone_number:String(v)};
          else if(t==='Select')props[c]={select:{name:String(v)}};
          else props[c]={rich_text:[{text:{content:String(v).slice(0,2000)}}]};
        });
        props['Status']={select:{name:row.status||'Active'}};
        props['Priority']={select:{name:row.priority||'Medium'}};
        return {parent:{database_id:dbId},properties:props};
      });
      var txt=JSON.stringify(payload,null,2);
      try{navigator.clipboard.writeText(txt).then(function(){toast('JSON payload copied','info');});}
      catch(e){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('Copied','info');}
    };

  });

  ['Browsers block direct API calls from local HTML files (CORS restriction).',
   'Pull often works. Push may be blocked.',
   'If blocked: use Copy JSON then paste into Zapier / Make.com / Postman.',
   'Host this file on Netlify / Vercel / GitHub Pages for full two-way live sync.'
  ].forEach(function(t){var d=mkEl('div',null,t);d.style.cssText='font-size:10px;color:var(--tx2);padding:2px 0;letter-spacing:.03em';note.appendChild(d);});
  frag.appendChild(note);
  return frag;
}

var MN_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var PRESET_COLORS_REM = ['#fbbf24','#60a5fa','#4ade80','#f87171','#a78bfa','#2dd4bf','#f97316','#e879f9','#94a3b8'];

function remColor(catId){
  var c=REM_CATS.filter(function(x){return x.id===catId;})[0];
  return c?c.color:'#7a7a90';
}
function remCatName(catId){
  var c=REM_CATS.filter(function(x){return x.id===catId;})[0];
  return c?c.name:catId;
}
function remExpand(yr,mo){
  var out=[];
  REM_EVENTS.forEach(function(ev){
    var d=new Date(ev.date+'T00:00:00');
    if(ev.rec==='monthly'){
      var iso=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      out.push(Object.assign({},ev,{date:iso,_orig:ev.id}));
    } else if(ev.rec==='yearly'){
      if(d.getMonth()===mo){
        var iso2=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        out.push(Object.assign({},ev,{date:iso2,_orig:ev.id}));
      }
    } else {
      if(d.getFullYear()===yr&&d.getMonth()===mo) out.push(ev);
    }
  });
  return out;
}

// Toggle a reminder's done state with a smooth, targeted DOM update —
// no full page/sidebar re-render, so there is no flash or scroll jump.
function toggleReminderDone(id, rowEl, chkEl) {
  REM_EVENTS = REM_EVENTS.map(function(x){ return x.id===id ? Object.assign({},x,{done:!x.done}) : x; });
  saveData();
  var ev = REM_EVENTS.filter(function(x){ return x.id===id; })[0];
  if(!ev) return;
  // Update just this row + checkbox in place — no scroll, no focus retention, no re-render
  rowEl.classList.toggle('rem-done', !!ev.done);
  chkEl.classList.toggle('on', !!ev.done);
  chkEl.textContent = ev.done ? '\u2713' : '';
  chkEl.title = ev.done ? 'Mark as not done' : 'Mark as done';
  // Remove focus immediately so the browser does not auto-scroll the
  // checkbox into view (this was the source of the visible jump/shake).
  if(chkEl.blur) chkEl.blur();
  // Update the sidebar reminder badge count without rebuilding the whole sidebar
  updateReminderBadge();
  // Update the X-of-Y-done subtitle if present, without re-rendering the page
  updateReminderSubtitle();
}
function updateReminderBadge() {
  var navBadges = document.querySelectorAll('.nav-item .nav-badge');
  // Reminder nav item is identified by icon text 'R' — find it by walking nav items
  var navItems = document.querySelectorAll('#sidebar .nav-item');
  navItems.forEach(function(item){
    var lbl = item.querySelector('.nav-lbl');
    if(lbl && lbl.textContent === 'Reminders') {
      var existing = item.querySelector('.nav-badge');
      var count = REM_EVENTS.length;
      if(count > 0) {
        if(existing) {
          existing.textContent = count;
        } else {
          var b = mkEl('span','nav-badge', count);
          b.style.borderColor = 'var(--ac)'; b.style.color = 'var(--ac)';
          item.appendChild(b);
        }
      } else if(existing) {
        existing.parentNode.removeChild(existing);
      }
    }
  });
}
function updateReminderSubtitle() {
  var subEl = document.querySelector('#page .sub');
  if(subEl && subEl.parentNode && subEl.parentNode.querySelector('.h1') && subEl.parentNode.querySelector('.h1').textContent === 'Reminders') {
    var doneCount = REM_EVENTS.filter(function(e){ return e.done; }).length;
    subEl.textContent = 'Calendar view \u00B7 recurring events \u00B7 ' + doneCount + ' of ' + REM_EVENTS.length + ' done';
  }
}

  frag.appendChild(hd);

  // Calendar card

  // ── Year picker mode ──
  if(REM_CAL.viewMode==='years'){
    var sy=Math.floor(yr/10)*10-1;
    var nav=mkEl('div','rem-nav');
    var pb=mkEl('button','rem-nbtn','<'); pb.onclick=function(){REM_CAL.year-=12;renderPage();};
    var tl=mkEl('div','rem-nav-title',sy+' – '+(sy+11));
    var nb=mkEl('button','rem-nbtn','>'); nb.onclick=function(){REM_CAL.year+=12;renderPage();};
    nav.appendChild(pb);nav.appendChild(tl);nav.appendChild(nb);wrap.appendChild(nav);
    var yg=mkEl('div','ym-grid');
    for(var y=sy;y<sy+12;y++){

      yb.onclick=(function(v){return function(){REM_CAL.year=v;REM_CAL.viewMode='months';renderPage();};})(yy);
      yg.appendChild(yb);
    }
    wrap.appendChild(yg);frag.appendChild(wrap);return frag;
  }

  // ── Month picker mode ──
  if(REM_CAL.viewMode==='months'){
    var nav2=mkEl('div','rem-nav');
    var pb2=mkEl('button','rem-nbtn','<'); pb2.onclick=function(){REM_CAL.year--;renderPage();};
    var tl2=mkEl('div','rem-nav-title',String(yr));
    tl2.onclick=function(){REM_CAL.viewMode='years';renderPage();};
    var nb2=mkEl('button','rem-nbtn','>'); nb2.onclick=function(){REM_CAL.year++;renderPage();};
    nav2.appendChild(pb2);nav2.appendChild(tl2);nav2.appendChild(nb2);wrap.appendChild(nav2);
    var mg=mkEl('div','ym-grid');
    MN_LONG.forEach(function(m,i){
      var mb=mkEl('button','ym-btn'+(i===mo?' on':''),m.slice(0,3));
      mb.onclick=(function(mi){return function(){REM_CAL.month=mi;REM_CAL.viewMode='days';renderPage();};})(i);
      mg.appendChild(mb);
    });
    wrap.appendChild(mg);frag.appendChild(wrap);return frag;
  }

  // ── Days view ──
  var nav3=mkEl('div','rem-nav');
  var pb3=mkEl('button','rem-nbtn','<');
  pb3.onclick=function(){REM_CAL.month--;if(REM_CAL.month<0){REM_CAL.month=11;REM_CAL.year--;}renderPage();};
  var tl3=mkEl('div','rem-nav-title',MN_LONG[mo]+' '+yr);
  tl3.onclick=function(){REM_CAL.viewMode='months';renderPage();};
  var nb3=mkEl('button','rem-nbtn','>');
  nb3.onclick=function(){REM_CAL.month++;if(REM_CAL.month>11){REM_CAL.month=0;REM_CAL.year++;}renderPage();};
  nav3.appendChild(pb3);nav3.appendChild(tl3);nav3.appendChild(nb3);wrap.appendChild(nav3);

  var grid=mkEl('div','rem-grid');
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){grid.appendChild(mkEl('div','rem-dname',d));});

  var firstDay=new Date(yr,mo,1).getDay();
  var daysInMo=new Date(yr,mo+1,0).getDate();
  var now3=new Date();
  var todayStr=now3.getFullYear()+'-'+String(now3.getMonth()+1).padStart(2,'0')+'-'+String(now3.getDate()).padStart(2,'0');
  var monthEvs=remExpand(yr,mo);
  var evByDay={};
  monthEvs.forEach(function(ev){var dd=parseInt(ev.date.split('-')[2]);(evByDay[dd]=evByDay[dd]||[]).push(ev);});

  for(var b=0;b<firstDay;b++){grid.appendChild(mkEl('div','rem-day otherm'));}
  for(var d=1;d<=daysInMo;d++){
    var iso=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cls='rem-day'+(iso===todayStr?' today':'');
    var cell=mkEl('div',cls);
    cell.appendChild(mkEl('div','rem-dn',d));
    var devs=evByDay[d]||[];
    devs.slice(0,2).forEach(function(ev){
      var chip=mkEl('div','rem-chip',ev.title);
      var chipStyle='background:'+remColor(ev.catId)+'22;color:'+remColor(ev.catId)+';border-left:2px solid '+remColor(ev.catId);
      if(ev.done) chipStyle+=';text-decoration:line-through;opacity:.55';
      chip.style.cssText=chipStyle;
      chip.onclick=(function(ev2){return function(e){e.stopPropagation();S.remPeek=Object.assign({},ev2,{id:ev2._orig||ev2.id});renderRemPeek();};})(ev);
      cell.appendChild(chip);
    });
    if(devs.length>2){var moreEl=mkEl('div',null,'+'+(devs.length-2)+' more');moreEl.style.cssText='font-size:8px;color:var(--tx3)';cell.appendChild(moreEl);}
    cell.onclick=(function(isoV){return function(){
      S.remPeek={id:null,title:'',catId:'personal',date:isoV,rec:'none',amount:'',notes:''};
      renderRemPeek();
    };})(iso);
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  frag.appendChild(wrap);

  // Overdue — not-done reminders whose date has already passed (Reminders is the
  // only place in Lume that surfaces an overdue concept).
  var overdueList=[];
  for(var mOv=-2;mOv<=0;mOv++){
    var totalMonth=now3.getMonth()+mOv;
    var yOv=now3.getFullYear()+Math.floor(totalMonth/12);
    var mOv2=((totalMonth%12)+12)%12;
    remExpand(yOv,mOv2).forEach(function(ev){
      if(ev.done) return;
      var ddOv=new Date(ev.date+'T00:00:00');
      if(ddOv<now3) overdueList.push(ev);
    });
  }
  // de-dupe by original id + date (recurring instances can repeat across the 3-month scan)
  var seenOv={};
  overdueList=overdueList.filter(function(ev){
    var key=(ev._orig||ev.id)+'|'+ev.date;
    if(seenOv[key]) return false;
    seenOv[key]=true; return true;

  overdueList.sort(function(a,b){return a.date.localeCompare(b.date);});

      var catLblOv=mkEl('span',null,remCatName(ev.catId));catLblOv.style.cssText='font-size:9px;color:'+remColor(ev.catId);
      meta.appendChild(catLblOv);
      var dOv=dL(ev.date);
      meta.appendChild(mkEl('span','rem-overdue-tag',Math.abs(dOv)+'d overdue — '+fD(ev.date)));

      info.appendChild(meta);row.appendChild(info);
      if(ev.amount){row.appendChild(mkEl('span','rem-amt',fP(ev.amount)));}
      var ebOv=mkEl('button','btn xs','Edit');
      ebOv.onclick=function(){S.remPeek=Object.assign({},ev,{id:realIdOv});renderRemPeek();};
      row.appendChild(ebOv);
      frag.appendChild(row);
    });
  }

  // Upcoming 30 days
  var upcoming=[];
  var fut30=new Date(now3.getTime()+30*86400000);
  for(var m2=0;m2<=1;m2++){
    var y2=now3.getFullYear()+(now3.getMonth()+m2>11?1:0),m3=(now3.getMonth()+m2)%12;
    remExpand(y2,m3).forEach(function(ev){
      var dd2=new Date(ev.date+'T00:00:00');

      var meta=mkEl('div');meta.style.cssText='display:flex;gap:8px;margin-top:2px;flex-wrap:wrap';
      var catLbl=mkEl('span',null,remCatName(ev.catId));catLbl.style.cssText='font-size:9px;color:'+remColor(ev.catId);
      meta.appendChild(catLbl);
      meta.appendChild(mkEl('span','rem-date',fD(ev.date)));
      if(ev.rec!=='none'){meta.appendChild(mkEl('span','rem-rec','↺ '+ev.rec));}
      info.appendChild(meta);row.appendChild(info);
      if(ev.amount){row.appendChild(mkEl('span','rem-amt',fP(ev.amount)));}
      var eb=mkEl('button','btn xs','Edit');
      eb.onclick=function(){S.remPeek=Object.assign({},ev,{id:realId});renderRemPeek();};
      row.appendChild(eb);

  // All events list

  ['all','pending','done'].forEach(function(f){
    var lbl=f==='all'?'All':f==='pending'?'Not Done':'Done';
    var chip=mkEl('button','fchip'+(S.remDoneFilter===f||(!S.remDoneFilter&&f==='all')?' on':''),lbl);
    chip.onclick=function(){S.remDoneFilter=f;renderPage();};
    doneFilterRow.appendChild(chip);
  });
  frag.appendChild(mkEl('div','rem-up-hd','All Reminders ('+REM_EVENTS.length+')'));
  frag.appendChild(doneFilterRow);
  var filteredAll=REM_EVENTS.slice();
  if(S.remDoneFilter==='done') filteredAll=filteredAll.filter(function(x){return x.done;});
  else if(S.remDoneFilter==='pending') filteredAll=filteredAll.filter(function(x){return !x.done;});
  if(!filteredAll.length){
    frag.appendChild(mkEl('div','sf-item','No reminders to show'));
  } else {
    filteredAll.forEach(function(ev){
      var row=mkEl('div','rem-row'+(ev.done?' rem-done':''));
      var chk=mkEl('button','rem-check'+(ev.done?' on':''),ev.done?'✓':'');
      chk.type='button';chk.title=ev.done?'Mark as not done':'Mark as done';
      var capChkId=ev.id;
      chk.onclick=function(e){
        e.stopPropagation();
        toggleReminderDone(capChkId, row, chk);
      };
      row.appendChild(chk);
      var dot=mkEl('div','rem-dot');dot.style.background=remColor(ev.catId);row.appendChild(dot);
      var info=mkEl('div');info.style.flex='1';
      info.appendChild(mkEl('div','rem-title',ev.title));
      var meta=mkEl('div');meta.style.cssText='display:flex;gap:8px;margin-top:2px;flex-wrap:wrap';
      var catLbl2=mkEl('span',null,remCatName(ev.catId));catLbl2.style.cssText='font-size:9px;color:'+remColor(ev.catId);
      meta.appendChild(catLbl2);
      meta.appendChild(mkEl('span','rem-date',fD(ev.date)));
      if(ev.rec!=='none'){meta.appendChild(mkEl('span','rem-rec','↺ '+ev.rec));}
      info.appendChild(meta);row.appendChild(info);
      if(ev.amount){row.appendChild(mkEl('span','rem-amt',fP(ev.amount)));}
      var eb2=mkEl('button','btn xs','Edit');
      eb2.onclick=(function(evv){return function(){S.remPeek=Object.assign({},evv);renderRemPeek();};})(ev);
      row.appendChild(eb2);
      var capId=ev.id;
      var db=mkEl('button','btn xs dng','Del');
      db.onclick=function(){showConfirm('Delete reminder?',function(){
        REM_EVENTS=REM_EVENTS.filter(function(x){return x.id!==capId;});
        saveData();renderPage();toast('Reminder deleted','error');
      });};
      row.appendChild(db);
      frag.appendChild(row);
    });
  }
  return frag;
}

// ============================================================
// PERSISTENCE — localStorage auto-save/load
// ============================================================
var STORAGE_KEY = 'lume_v1';

function saveData() {
  try {
    var payload = {version:3,savedAt:new Date().toISOString(),trackers:{},services:{cats:SVC.cats,items:SVC.items},reminders:{events:REM_EVENTS,cats:REM_CATS}};
    SKEYS.forEach(function(k){ payload.trackers[k] = SCHEMA[k].rows; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch(e) { console.warn('Lume: could not save to localStorage', e); }
}

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    var d = JSON.parse(raw);
    if(!d || !d.trackers) return false;
    SKEYS.forEach(function(k){ if(d.trackers[k] && Array.isArray(d.trackers[k])) SCHEMA[k].rows = d.trackers[k]; });
    if(d.services){
      if(d.services.cats&&Array.isArray(d.services.cats))SVC.cats=d.services.cats;
      if(d.services.items&&Array.isArray(d.services.items))SVC.items=d.services.items;
    }
    if(d.reminders){
      if(d.reminders.events&&Array.isArray(d.reminders.events))REM_EVENTS=d.reminders.events;
      if(d.reminders.cats&&Array.isArray(d.reminders.cats))REM_CATS=d.reminders.cats;
    }
    return true;
  } catch(e) { console.warn('Lume: could not load from localStorage', e); return false; }
}

function clearData() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}


// ============================================================
// CUSTOM CALENDAR PICKER
// ============================================================
var CAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var CAL_DAYS   = ['Su','Mo','Tu','We','Th','Fr','Sa'];

function makeDatePicker(labelTxt, initialVal, onChange) {
  var cur = initialVal ? new Date(initialVal + 'T00:00:00') : new Date();
  if(isNaN(cur.getTime())) cur = new Date();
  var viewYear  = cur.getFullYear();
  var viewMonth = cur.getMonth();
  var selDate   = initialVal || null;
  var viewMode  = 'days';
  var popupOpen = false;

  var wrap = mkEl('div', 'fg cal-wrap');
  wrap.appendChild(mkEl('span', 'fl', labelTxt));

  var inputRow = mkEl('div', 'cal-input-row');
  var textInp = mkEl('input', 'cal-text');
  textInp.type = 'text';
  textInp.value = selDate ? formatDateDisplay(selDate) : '';
  textInp.placeholder = 'DD Mon YYYY';
  textInp.autocomplete = 'off';
  textInp.readOnly = true; // prevents keyboard focus race-conditions — calendar is the only entry point

  var calBtn = mkEl('button', 'cal-btn');
  calBtn.type = 'button';
  calBtn.innerHTML = '&#128197;';
  calBtn.title = 'Pick date';

  inputRow.appendChild(textInp);
  inputRow.appendChild(calBtn);
  wrap.appendChild(inputRow);

  var popup = mkEl('div', 'cal-popup hidden');
  wrap.appendChild(popup);

  function formatDateDisplay(iso) {
    try {
      var d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
    } catch(e) { return iso; }
  }
  function toISO(d) {
    var m = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + dd;
  }
  function selectDate(iso) {
    selDate = iso;
    textInp.value = formatDateDisplay(iso);
    onChange(iso);
    closePopup();
  }
  function closePopup() {
    popupOpen = false;
    popup.classList.add('hidden');
    document.removeEventListener('mousedown', outsideClickHandler, true);
  }
  function openPopup() {
    popupOpen = true;
    popup.classList.remove('hidden');
    renderCal();
    // Defer attaching the outside-click listener so the same click that
    // opened the popup doesn't immediately close it.
    setTimeout(function(){
      document.addEventListener('mousedown', outsideClickHandler, true);
    }, 0);
  }
  function outsideClickHandler(e) {
    if(!wrap.contains(e.target)) closePopup();
  }

  calBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    if(popupOpen) closePopup(); else openPopup();
  });
  // Also allow clicking the (read-only) text field to open the calendar
  textInp.addEventListener('click', function(e) {
    e.stopPropagation();
    if(!popupOpen) openPopup();
  });

  function renderCal() {
    popup.innerHTML = '';
    if(viewMode === 'months') { renderMonthPicker(); return; }
    if(viewMode === 'years')  { renderYearPicker();  return; }

    var nav = mkEl('div', 'cal-nav');
    var prevBtn = mkEl('button', 'cal-nav-btn', '\u2039');
    prevBtn.type = 'button';
    prevBtn.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;}
      renderCal();
    });
    var lbl = mkEl('div', 'cal-month-lbl', CAL_MONTHS[viewMonth] + ' ' + viewYear);
    lbl.addEventListener('click', function(e){ e.stopPropagation(); viewMode='months'; renderCal(); });
    var nextBtn = mkEl('button', 'cal-nav-btn', '\u203A');
    nextBtn.type = 'button';
    nextBtn.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;}
      renderCal();
    });
    nav.appendChild(prevBtn); nav.appendChild(lbl); nav.appendChild(nextBtn);
    popup.appendChild(nav);

    var grid = mkEl('div', 'cal-grid');
    var dayNames = mkEl('div', 'cal-day-names');
    CAL_DAYS.forEach(function(d){ dayNames.appendChild(mkEl('div','cal-day-name',d)); });
    grid.appendChild(dayNames);

    var days = mkEl('div', 'cal-days');
    var firstDay = new Date(viewYear, viewMonth, 1).getDay();
    var daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    var todayISO = toISO(new Date());

    for(var i=0; i<firstDay; i++) {
      var blank = mkEl('button','cal-day cal-day-empty',' ');
      blank.type = 'button'; blank.disabled = true;
      days.appendChild(blank);
    }
    for(var d=1; d<=daysInMonth; d++) {
      var iso = viewYear + '-' + String(viewMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var cls = 'cal-day';
      if(iso === todayISO) cls += ' today';
      if(iso === selDate)  cls += ' selected';
      var btn = mkEl('button', cls, String(d));
      btn.type = 'button';
      btn.setAttribute('data-iso', iso);
      btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        selectDate(this.getAttribute('data-iso'));
      });
      days.appendChild(btn);
    }
    grid.appendChild(days);
    popup.appendChild(grid);

    var sc = mkEl('div', 'cal-shortcuts');
    var shortcuts = [
      {l:'Today', fn:function(){ selectDate(toISO(new Date())); }},
      {l:'+7d',   fn:function(){ var d=new Date(); d.setDate(d.getDate()+7); selectDate(toISO(d)); }},
      {l:'+1mo',  fn:function(){ var d=new Date(); d.setMonth(d.getMonth()+1); selectDate(toISO(d)); }},
      {l:'+3mo',  fn:function(){ var d=new Date(); d.setMonth(d.getMonth()+3); selectDate(toISO(d)); }},
      {l:'+1yr',  fn:function(){ var d=new Date(); d.setFullYear(d.getFullYear()+1); selectDate(toISO(d)); }},
      {l:'Clear', fn:function(){ selDate=null; textInp.value=''; onChange(''); closePopup(); }}
    ];
    shortcuts.forEach(function(s){
      var b = mkEl('button','cal-sc',s.l);
      b.type = 'button';
      b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); s.fn(); });
      sc.appendChild(b);
    });
    popup.appendChild(sc);
  }

  function renderMonthPicker() {
    var nav = mkEl('div', 'cal-nav');
    var prevBtn = mkEl('button','cal-nav-btn','\u2039');
    prevBtn.type = 'button';
    prevBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); viewYear--; renderCal(); });
    var lbl = mkEl('div','cal-month-lbl',String(viewYear));
    lbl.addEventListener('click', function(e){ e.stopPropagation(); viewMode='years'; renderCal(); });
    var nextBtn = mkEl('button','cal-nav-btn','\u203A');
    nextBtn.type = 'button';
    nextBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); viewYear++; renderCal(); });
    nav.appendChild(prevBtn); nav.appendChild(lbl); nav.appendChild(nextBtn);
    popup.appendChild(nav);
    var g = mkEl('div','cal-ym-grid');
    CAL_MONTHS.forEach(function(m,i){
      var b = mkEl('button','cal-ym-btn'+(i===viewMonth?' on':''),m.slice(0,3));
      b.type = 'button';
      b.setAttribute('data-month', String(i));
      b.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        viewMonth = parseInt(this.getAttribute('data-month'), 10);
        viewMode = 'days';
        renderCal();
      });
      g.appendChild(b);
    });
    popup.appendChild(g);
  }

  function renderYearPicker() {
    var startYear = Math.floor(viewYear/10)*10 - 5;
    var nav = mkEl('div','cal-nav');
    var prevBtn = mkEl('button','cal-nav-btn','\u2039');
    prevBtn.type = 'button';
    var lbl = mkEl('div','cal-month-lbl', startYear+' \u2013 '+(startYear+11));
    var nextBtn = mkEl('button','cal-nav-btn','\u203A');
    nextBtn.type = 'button';
    nav.appendChild(prevBtn); nav.appendChild(lbl); nav.appendChild(nextBtn);
    popup.appendChild(nav);

    var g = mkEl('div','cal-ym-grid');
    popup.appendChild(g);

    function paint(sy) {
      lbl.textContent = sy+' \u2013 '+(sy+11);
      g.innerHTML = '';
      for(var y=sy; y<sy+12; y++) {
        var yr = y;
        var b = mkEl('button','cal-ym-btn'+(yr===viewYear?' on':''), String(yr));
        b.type = 'button';
        b.setAttribute('data-year', String(yr));
        b.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation();
          viewYear = parseInt(this.getAttribute('data-year'), 10);
          viewMode = 'months';
          renderCal();
        });
        g.appendChild(b);
      }
    }
    prevBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); startYear -= 12; paint(startYear); });
    nextBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); startYear += 12; paint(startYear); });
    paint(startYear);
  }

  if(selDate) {
    var dInit = new Date(selDate + 'T00:00:00');
    if(!isNaN(dInit.getTime())) { viewYear = dInit.getFullYear(); viewMonth = dInit.getMonth(); }
  }
  return wrap;
}


// ── SMART INPUT TYPES ────────────────────────────────────────────────────────
function makeSmartField(col, val, onChange) {
  var lc = col.toLowerCase();
  // Currency / price fields
  if(lc === 'price' || lc === 'cost' || lc.indexOf('price') >= 0 || lc === 'points' || lc.indexOf('reward') >= 0) {
    var g = mkEl('div','fg');
    g.appendChild(mkEl('span','fl',col));
    var cw = mkEl('div','fi-currency');
    var inp = mkEl('input','fi');
    inp.type = 'number'; inp.value = val || ''; inp.placeholder = '0';
    inp.min = '0'; inp.step = '1';
    inp.style.paddingLeft = '22px';
    inp.oninput = inp.onchange = function(){ onChange(inp.value); };
    cw.appendChild(inp); g.appendChild(cw);
    g.appendChild(mkEl('div','fi-note','Amount in \u20B9 (Indian Rupees)'));
    return g;
  }
  // Phone fields
  if(lc === 'phone' || lc.indexOf('phone') >= 0 || lc.indexOf('contact') >= 0 || lc.indexOf('number') >= 0) {
    var g2 = mkEl('div','fg');
    g2.appendChild(mkEl('span','fl',col));
    var inp2 = mkEl('input','fi');
    inp2.type = 'tel'; inp2.value = val || ''; inp2.placeholder = '+91 98765 43210';
    inp2.oninput = inp2.onchange = function(){ onChange(inp2.value); };
    g2.appendChild(inp2);
    return g2;
  }
  // Mileage / reading / numeric
  if(lc === 'mileage' || lc === 'reading') {
    var g3 = mkEl('div','fg');
    g3.appendChild(mkEl('span','fl',col));
    var row3 = mkEl('div','fi-group');
    var inp3 = mkEl('input','fi'); inp3.type='number'; inp3.value=val||''; inp3.placeholder='0'; inp3.step='0.1';
    inp3.oninput=inp3.onchange=function(){onChange(inp3.value);};
    var addon3 = mkEl('div','fi-group-addon', lc==='mileage'?'km/L':'km');
    row3.appendChild(inp3); row3.appendChild(addon3);
    g3.appendChild(row3);
    return g3;
  }
  // Description / notes (multi-line)
  if(lc === 'description' || lc === 'notes' || lc === 'address' || lc.indexOf('desc') >= 0) {
    var g4 = mkEl('div','fg');
    g4.appendChild(mkEl('span','fl',col));
    var ta = document.createElement('textarea');
    ta.className = 'fi'; ta.value = val || ''; ta.placeholder = col;
    ta.rows = 2; ta.style.resize = 'vertical'; ta.style.fontFamily = 'JetBrains Mono,monospace';
    ta.oninput = ta.onchange = function(){ onChange(ta.value); };
    g4.appendChild(ta);
    return g4;
  }
  // Relation / Utility (short select-like text with suggestions)
  if(lc === 'relation' || lc === 'utility') {
    var g5 = mkEl('div','fg');
    g5.appendChild(mkEl('span','fl',col));
    var inp5 = mkEl('input','fi');
    inp5.type = 'text'; inp5.value = val || ''; inp5.placeholder = col;
    var suggestions = lc === 'relation' ? ['Finance','Legal','Medical','Family Doctor','Housing','Emergency','Work'] : ['Plumbing','Electrical','Pest Control','Internet','Carpentry','Painting','HVAC','Security'];
    var list = document.createElement('datalist');
    list.id = 'dl-' + lc + '-' + Date.now();
    suggestions.forEach(function(s){ var opt=document.createElement('option'); opt.value=s; list.appendChild(opt); });
    inp5.setAttribute('list', list.id);
    inp5.oninput = inp5.onchange = function(){ onChange(inp5.value); };
    g5.appendChild(inp5); g5.appendChild(list);
    return g5;
  }
  // Default text
  var gd = mkEl('div','fg');
  gd.appendChild(mkEl('span','fl',col));
  var inpd = mkEl('input','fi');
  inpd.type = 'text'; inpd.value = val || ''; inpd.placeholder = col;
  inpd.oninput = inpd.onchange = function(){ onChange(inpd.value); };
  gd.appendChild(inpd);
  return gd;
}

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js')
      .then(function(reg){ console.log('Lume SW registered:', reg.scope); })
      .catch(function(err){ console.log('SW registration failed:', err); });

// ============================================================
// MOBILE BOTTOM NAV
// ============================================================
var MOBILE_NAV_GROUPS = [
  {lbl:'Trackers', icon:'\u2630', items:['AMC','CarMaintenance','CarFuel','NegligenceCosts','TravelData','ExpensivePurchase','CriticalContacts','AccountDetails','ServiceProviders','CreditCardRewards']},
  {lbl:'Life', icon:'\u2605', items:['Subscriptions','DineOut','GeneralTracker','DecisionLog','AppsList']},
  {lbl:'Calendar', icon:'\u25A6', tab:'expCal'},
  {lbl:'Services', icon:'\u2302', tab:'services'},
  {lbl:'Sync', icon:'\u2197', tab:'notion'}
];

function renderMobileNav() {
  var nav = document.getElementById('mobile-nav');
  if(!nav) return;
  nav.innerHTML = '';
  MOBILE_NAV_GROUPS.forEach(function(grp) {
    var btn = document.createElement('button');
    var isActive = grp.tab ? S.tab===grp.tab : (grp.items&&grp.items.indexOf(S.tab)>=0);
    btn.className = 'mnav-item' + (isActive?' active':'');
    var iconEl = document.createElement('span'); iconEl.className='mnav-icon'; iconEl.textContent=grp.icon;
    var lblEl  = document.createElement('span'); lblEl.className='mnav-lbl';   lblEl.textContent=grp.lbl;
    btn.appendChild(iconEl); btn.appendChild(lblEl);
    if(grp.tab) {
      btn.onclick = function(){ S.tab=grp.tab; renderPage(); renderTopbar(); renderMobileNav(); };
    } else {
      btn.onclick = function(){ showMobileGroupPicker(grp); };
    }
    nav.appendChild(btn);
  });
}

function showMobileGroupPicker(grp) {
  var existing = document.getElementById('mob-picker');
  if(existing){ existing.parentNode.removeChild(existing); return; }
  var ov = document.createElement('div');
  ov.id='mob-picker';
  ov.style.cssText='position:fixed;inset:0;z-index:350;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;backdrop-filter:blur(4px)';
  ov.onclick=function(e){ if(e.target===ov) ov.parentNode.removeChild(ov); };
  var sheet = document.createElement('div');
  sheet.style.cssText='background:var(--sf);width:100%;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto';
  var hd = document.createElement('div');
  hd.style.cssText='font-family:Syne,sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bd)';
  hd.textContent=grp.lbl; sheet.appendChild(hd);
  grp.items.forEach(function(k){
    var sch=SCHEMA[k]; if(!sch) return;
    var row=document.createElement('button');
    row.style.cssText='display:flex;align-items:center;gap:10px;width:100%;padding:12px 4px;border:none;cursor:pointer;border-bottom:1px solid var(--bd);text-align:left;background:'+(k===S.tab?'var(--glow)':'none');
    var ic=document.createElement('span');
    ic.style.cssText='width:28px;height:28px;border:1px solid var(--bdhi);display:flex;align-items:center;justify-content:center;font-family:Syne,sans-serif;font-weight:700;font-size:12px;color:'+sch.col+';flex-shrink:0';
    ic.textContent=sch.icon;
    var lbl=document.createElement('span');
    lbl.style.cssText='flex:1;font-family:Inter,sans-serif;font-size:13px;color:var(--tx);font-weight:500';
    lbl.textContent=sch.label;
    var cnt=document.createElement('span');
    cnt.style.cssText='font-size:10px;color:var(--tx3);font-family:JetBrains Mono,monospace';
    cnt.textContent=sch.rows.length;
    row.appendChild(ic); row.appendChild(lbl); row.appendChild(cnt);
    row.onclick=function(){ S.tab=k; renderPage(); renderTopbar(); renderMobileNav(); ov.parentNode.removeChild(ov); };
    sheet.appendChild(row);
  });
  ov.appendChild(sheet); document.body.appendChild(ov);
}

// Wrap renderSidebar and renderTopbar to also refresh mobile nav
var _origRS = renderSidebar;
renderSidebar = function(){ _origRS(); renderMobileNav(); };
var _origRT = renderTopbar;
renderTopbar = function(){ _origRT(); renderMobileNav(); };

// ============================================================
// BOOT — load persisted data first, then render
// ============================================================
var _loaded = loadData();
renderSidebar();
renderTopbar();
renderPage();
if(_loaded) toast('Data loaded from last session', 'success');
</script>

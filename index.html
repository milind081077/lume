<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LUME</title>

<!-- PWA: installability + standalone app behavior on Android/iOS -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lume">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a0f;--sf:#111118;--sf2:#18181f;
  --bd:#2a2a35;--bdhi:#3d3d52;
  --ac:#c9a84c;--ac2:#7c6bff;--ac3:#4cc9a8;
  --dng:#ff4c6b;--glow:rgba(201,168,76,.12);
  --tx:#e8e8f0;--tx2:#7a7a90;--tx3:#3a3a50;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'DM Mono',monospace;font-size:12px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bd)}
::-webkit-scrollbar-track{background:transparent}

/* layout */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:238px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:54px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex-shrink:0;background:var(--sf)}
#page{flex:1;overflow-y:auto;padding:26px}

/* sidebar */
.logo{padding:18px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;border:1px solid var(--ac);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ac);flex-shrink:0;font-family:'Syne',sans-serif;font-weight:800}
.logo-name{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;letter-spacing:.16em;text-transform:uppercase}
.logo-sub{font-size:9px;color:var(--tx3);letter-spacing:.18em;text-transform:uppercase;margin-top:1px}
.sb-warn{margin:10px 10px 0;background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.28);padding:7px 11px;font-size:10px;color:var(--ac);display:flex;align-items:center;gap:7px}
.blink{width:5px;height:5px;background:var(--ac);flex-shrink:0;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-g{padding:13px 15px 3px;font-family:'Syne',sans-serif;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:8px}
.nav-g::after{content:'';flex:1;height:1px;background:var(--bd)}
.nav-item{width:100%;display:flex;align-items:center;gap:8px;padding:7px 14px;border:none;background:none;cursor:pointer;text-align:left;font-family:'DM Mono',monospace;font-size:11px;color:var(--tx2);border-left:2px solid transparent;transition:all .14s;letter-spacing:.04em}
.nav-item:hover{background:var(--glow);color:var(--tx)}
.nav-item.active{background:rgba(201,168,76,.08);color:var(--ac);border-left-color:var(--ac)}
.nav-icon{font-size:10px;width:14px;text-align:center;flex-shrink:0}
.nav-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-badge{font-size:9px;border:1px solid var(--dng);color:var(--dng);padding:1px 5px;flex-shrink:0}
.sb-foot{padding:10px 14px 13px;border-top:1px solid var(--bd)}
.sf-hd{font-family:'Syne',sans-serif;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sf-hd::after{content:'';flex:1;height:1px;background:var(--bd)}
.sf-item{font-size:10px;color:var(--tx2);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* topbar */
.tb-bc{font-size:11px;color:var(--tx2);letter-spacing:.06em}
.tb-right{display:flex;align-items:center;gap:7px}
.tb-date{font-size:10px;color:var(--tx3);letter-spacing:.07em}

/* headings */
.h1{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;letter-spacing:.07em;text-transform:uppercase}
.sub{font-size:11px;color:var(--tx2);margin-top:4px;letter-spacing:.04em}

/* buttons */
.btn{padding:7px 14px;border:1px solid var(--bdhi);background:transparent;color:var(--tx2);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .16s}
.btn:hover{border-color:var(--ac);color:var(--ac);background:var(--glow)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0a0a0f;font-weight:500}
.btn.pri:hover{background:#e0bb62;border-color:#e0bb62}
.btn.dng:hover{border-color:var(--dng);color:var(--dng);background:rgba(255,76,107,.07)}
.btn.sm{padding:5px 10px;font-size:10px}
.btn.xs{padding:3px 8px;font-size:9px}

/* stat bar */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--bd);margin-bottom:22px}
.stat{padding:14px 17px;border-right:1px solid var(--bd)}
.stat:last-child{border-right:none}
.stat-n{font-family:'Syne',sans-serif;font-weight:700;font-size:22px}
.stat-l{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.14em;margin-top:3px}

/* filters */
.frow{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap;align-items:center}
.fin{background:var(--bg);border:1px solid var(--bdhi);color:var(--tx);font-family:'DM Mono',monospace;font-size:11px;padding:7px 11px;outline:none;transition:border-color .16s;letter-spacing:.04em;flex:1;min-width:140px}
.fin:focus{border-color:var(--ac)}
.fsel{background:var(--bg);border:1px solid var(--bdhi);color:var(--tx);font-family:'DM Mono',monospace;font-size:11px;padding:7px 11px;outline:none;letter-spacing:.04em;cursor:pointer}
.fsel:focus{border-color:var(--ac)}
.fchip{padding:4px 10px;border:1px solid var(--bd);background:var(--sf2);font-family:'DM Mono',monospace;font-size:10px;color:var(--tx2);cursor:pointer;transition:all .14s;letter-spacing:.06em;text-transform:uppercase}
.fchip:hover,.fchip.on{border-color:var(--ac);color:var(--ac);background:var(--glow)}

/* table */
.tbl-wrap{border:1px solid var(--bd);overflow:hidden}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
thead tr{background:var(--sf2)}
th{padding:9px 12px;text-align:left;font-family:'Syne',sans-serif;font-size:9px;font-weight:400;color:var(--tx3);text-transform:uppercase;letter-spacing:.18em;white-space:nowrap;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd)}
th:last-child{border-right:none}
td{padding:10px 12px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);vertical-align:middle;color:var(--tx2)}
td:last-child{border-right:none}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--sf2);color:var(--tx)}
.clip{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.hi{color:var(--tx)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border:1px solid;font-size:9px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.dot{width:4px;height:4px;flex-shrink:0}
.pri-chip{font-size:9px;padding:2px 6px;border:1px solid;letter-spacing:.06em;text-transform:uppercase;display:inline-block}

/* score */
.sc{display:flex;align-items:center;gap:7px}
.sc-t{flex:1;height:2px;background:var(--bd);min-width:40px}
.sc-f{height:100%}
.sc-n{font-size:10px;min-width:20px;text-align:right;font-weight:500}

/* ── PEEK PANEL ── */
.peek-bg{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;justify-content:flex-end}
.peek{width:440px;background:var(--sf);height:100%;overflow-y:auto;border-left:1px solid var(--bdhi);box-shadow:0 0 60px rgba(0,0,0,.8);display:flex;flex-direction:column}
.peek::-webkit-scrollbar{width:3px}
.peek-hd{padding:17px 20px 13px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}
.peek-tag{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.18em;margin-bottom:3px}
.peek-title{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;letter-spacing:.09em;text-transform:uppercase}
.peek-body{padding:17px 20px;flex:1;overflow-y:auto}
.peek-body::-webkit-scrollbar{width:3px}
.fg{margin-bottom:13px}
.fl{display:block;font-family:'Syne',sans-serif;font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.2em;margin-bottom:5px}
.fi{width:100%;padding:8px 11px;background:var(--bg);border:1px solid var(--bdhi);color:var(--tx);font-family:'DM Mono',monospace;font-size:11px;outline:none;transition:border-color .16s;letter-spacing:.04em}
.fi:focus{border-color:var(--ac)}
.fi-sel{width:100%;padding:8px 11px;background:var(--bg);border:1px solid var(--bdhi);color:var(--tx);font-family:'DM Mono',monospace;font-size:11px;outline:none;letter-spacing:.04em;cursor:pointer}
.fi-sel:focus{border-color:var(--ac)}
.fi2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}
.drive-row{display:flex;gap:7px;align-items:center}
.drive-note{font-size:9px;color:var(--tx3);margin-top:3px;line-height:1.5}
.schema-box{background:var(--bg);border:1px solid var(--bd);padding:10px 13px;margin-top:12px}
.schema-hd{font-family:'Syne',sans-serif;font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.22em;margin-bottom:6px}
.schema-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);font-size:10px}
.schema-row:last-child{border-bottom:none}

/* ── CONFIRM DIALOG ── */
.cfm-bg{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.cfm-box{background:var(--sf);border:1px solid var(--dng);width:320px;padding:26px 24px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.8)}
.cfm-msg{font-size:12px;color:var(--tx);letter-spacing:.04em;margin-bottom:20px;line-height:1.6}
.cfm-btns{display:flex;gap:10px;justify-content:center}
.cfm-yes{padding:9px 22px;border:1px solid var(--dng);background:rgba(255,76,107,.12);color:var(--dng);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;transition:background .14s}
.cfm-yes:hover{background:rgba(255,76,107,.25)}
.cfm-no{padding:9px 22px;border:1px solid var(--bdhi);background:transparent;color:var(--tx2);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;transition:all .14s}
.cfm-no:hover{border-color:var(--tx2);color:var(--tx)}

/* ── JSON MODAL ── */
.json-bg{position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.json-box{background:var(--sf);border:1px solid var(--bdhi);width:580px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.7)}
.json-hd{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.json-title{font-family:'Syne',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.json-ta{flex:1;background:var(--bg);border:none;color:var(--ac3);font-family:'DM Mono',monospace;font-size:10px;padding:14px;outline:none;resize:none;line-height:1.6;overflow-y:auto;min-height:200px}
.json-ft{padding:11px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}

/* PDF preview */
.pdf-bg{position:fixed;inset:0;z-index:600;background:var(--bg);display:flex;flex-direction:column}
.pdf-bar{height:50px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 18px;flex-shrink:0}
.pdf-title{font-family:'Syne',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;flex:1}
.pdf-body{flex:1;overflow:auto;padding:24px;background:var(--bg)}
.pdf-tbl{width:100%;border-collapse:collapse;font-family:'DM Mono',monospace;font-size:11px}
.pdf-tbl th{background:var(--sf2);color:var(--tx3);padding:8px 11px;border:1px solid var(--bd);font-size:9px;text-transform:uppercase;letter-spacing:.14em;text-align:left;font-family:'Syne',sans-serif;font-weight:400}
.pdf-tbl td{padding:8px 11px;border:1px solid var(--bd);color:var(--tx2)}
@media print{#app,#sidebar,#topbar,.toast-wrap{display:none!important}.pdf-bg,.pdf-body{display:block!important;position:static!important;overflow:visible!important}.pdf-bar{display:none!important}}

/* ── MOBILE RESPONSIVE (≤768px) — off-canvas sidebar drawer ── */
.sb-scrim{display:none}
.hamburger{display:none;background:none;border:1px solid var(--bdhi);color:var(--tx2);width:34px;height:34px;cursor:pointer;font-size:15px;align-items:center;justify-content:center;flex-shrink:0}
.hamburger:hover{border-color:var(--ac);color:var(--ac)}
@media(max-width:768px){
  html,body{font-size:13px}
  #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:300;width:250px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #sidebar.open{transform:translateX(0)}
  .sb-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:290}
  .sb-scrim.on{display:block}
  .hamburger{display:flex}
  #topbar{padding:0 14px;gap:8px}
  #page{padding:16px}
  .tb-bc{font-size:10px}
  .tb-right{gap:5px}
  .tb-right .btn.xs{padding:4px 7px;font-size:8px}
  .tb-date{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .pgrid{grid-template-columns:1fr}
  .svc-grid{grid-template-columns:1fr}
  .peek-bg{padding:0}
  .peek{width:100%;max-width:100%}
  .fi2,.fi-row{grid-template-columns:1fr}
  .h1{font-size:15px}
  .rem-day{min-height:40px}
  .rem-grid{gap:1px}
  .pdf-body{padding:12px}
  .pdf-sheet{padding:18px 16px}
  .json-box{width:94vw}
  .modal{width:92vw}
}

/* pulse */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pcard{background:var(--sf);border:1px solid var(--bd);padding:13px 15px;display:flex;align-items:flex-start;gap:11px;transition:all .16s;position:relative;overflow:hidden;cursor:default}
.pcard:hover{border-color:var(--bdhi);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.pcard-bar{position:absolute;top:0;left:0;width:100%;height:2px}
.p-icon{width:28px;height:28px;border:1px solid var(--bdhi);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-family:'Syne',sans-serif;font-weight:700;color:var(--tx2)}
.p-meta{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.11em;margin-bottom:2px}
.p-name{font-size:11px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-due{font-size:9px;margin-top:3px;letter-spacing:.05em}

/* services */
.svc-sec{margin-bottom:24px}
.svc-cat-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.svc-cat-title{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.svc-cat-count{font-size:9px;color:var(--tx3);font-family:'DM Mono',monospace}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:11px}
.svc-card{background:var(--sf);border:1px solid var(--bd);overflow:hidden;transition:all .16s;position:relative}
.svc-card:hover{border-color:var(--bdhi);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.svc-bar{position:absolute;left:0;top:0;bottom:0;width:2px}
.svc-top{padding:12px 15px 10px}
.svc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.svc-name{font-size:11px;color:var(--tx);letter-spacing:.04em;padding-right:6px}
.svc-pill{font-size:9px;color:var(--tx3);border:1px solid var(--bd);padding:2px 6px;letter-spacing:.05em;white-space:nowrap}
.svc-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:3px;font-size:10px;color:var(--tx2)}
.svc-hist{background:var(--sf2);border-top:1px solid var(--bd);padding:9px 15px}
.svc-hist-hd{font-family:'Syne',sans-serif;font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.2em;margin-bottom:6px}
.svc-hi{display:flex;align-items:flex-start;gap:7px;margin-bottom:6px}
.svc-hi-dot{width:4px;height:4px;background:var(--bdhi);margin-top:4px;flex-shrink:0}
.svc-hi-desc{font-size:10px;color:var(--tx2)}
.svc-hi-meta{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
.svc-hi-d,.svc-hi-w{font-size:9px;color:var(--tx3)}
.svc-hi-c{font-size:9px;font-weight:500;color:var(--ac)}
.svc-hist-empty{font-size:10px;color:var(--tx3);font-style:italic}
.log-btn{background:none;border:none;font-family:'DM Mono',monospace;font-size:10px;color:var(--ac3);cursor:pointer;padding:0;letter-spacing:.06em;margin-top:6px;text-transform:uppercase}
.log-btn:hover{opacity:.65}
.svc-acts{display:flex;gap:7px;padding:8px 15px 10px;border-top:1px solid var(--bd);background:var(--sf2)}
.empty{text-align:center;padding:30px;color:var(--tx3);font-size:10px;border:1px dashed var(--bd);letter-spacing:.08em;text-transform:uppercase}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--sf);border:1px solid var(--bdhi);width:370px;box-shadow:0 24px 80px rgba(0,0,0,.7)}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.modal-body{padding:16px 20px}
.modal-ft{padding:11px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}

/* toasts */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:900;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--sf);border:1px solid var(--bdhi);box-shadow:0 8px 28px rgba(0,0,0,.5);font-size:11px;padding:10px 15px;min-width:200px;border-left:3px solid;letter-spacing:.04em;animation:tIn .18s ease}
@keyframes tIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
.toast.ok{border-left-color:var(--ac3);color:var(--ac3)}
.toast.err{border-left-color:var(--dng);color:var(--dng)}
.toast.inf{border-left-color:var(--ac);color:var(--ac)}

.sec-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.t-icon{width:32px;height:32px;border:1px solid var(--bdhi);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-right:10px;font-family:'Syne',sans-serif;font-weight:700;color:var(--tx2)}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadeUp .18s ease both}

/* notion */
.n-card{background:var(--sf2);border:1px solid var(--bd);margin-bottom:8px}
.n-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.n-icon{width:26px;height:26px;border:1px solid var(--bdhi);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-family:'Syne',sans-serif;font-weight:700;color:var(--tx2)}
.n-acts{display:flex;gap:7px;padding:8px 14px;align-items:center}
.n-schema{padding:0 14px 10px;display:none}

/* ── CALENDAR PICKER ── */
.cal-wrap{position:relative;width:100%}
.cal-input-row{display:flex;gap:0;width:100%}
.cal-text{flex:1;padding:8px 11px;background:var(--bg);border:1px solid var(--bdhi);border-right:none;color:var(--tx);font-family:'DM Mono',monospace;font-size:11px;outline:none;letter-spacing:.06em;min-width:0}
.cal-text:focus{border-color:var(--ac)}
.cal-btn{padding:8px 12px;background:var(--sf2);border:1px solid var(--bdhi);color:var(--tx2);cursor:pointer;font-size:13px;flex-shrink:0;transition:all .14s;display:flex;align-items:center;justify-content:center}
.cal-btn:hover{border-color:var(--ac);color:var(--ac);background:var(--glow)}
.cal-popup{position:absolute;top:calc(100% + 4px);left:0;z-index:2000;background:var(--sf);border:1px solid var(--bdhi);box-shadow:0 12px 40px rgba(0,0,0,.7);width:280px;user-select:none}
.cal-popup.hidden{display:none}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--bd)}
.cal-nav-btn{background:none;border:1px solid var(--bd);color:var(--tx2);width:26px;height:26px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .12s;font-family:'DM Mono',monospace}
.cal-nav-btn:hover{border-color:var(--ac);color:var(--ac)}
.cal-month-lbl{font-family:'Syne',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx);cursor:pointer}
.cal-month-lbl:hover{color:var(--ac)}
.cal-grid{padding:8px 10px 10px}
.cal-day-names{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.cal-day-name{font-family:'Syne',sans-serif;font-size:9px;text-align:center;color:var(--tx3);letter-spacing:.1em;padding:3px 0;text-transform:uppercase}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{background:none;border:none;color:var(--tx2);font-family:'DM Mono',monospace;font-size:11px;padding:5px 0;cursor:pointer;text-align:center;border-radius:0;transition:all .12s;border:1px solid transparent}
.cal-day:hover:not(.cal-day-empty):not(.cal-day-disabled){background:var(--glow);border-color:var(--ac);color:var(--ac)}
.cal-day.today{color:var(--ac3);font-weight:500}
.cal-day.selected{background:var(--ac);color:#0a0a0f;font-weight:600;border-color:var(--ac)}
.cal-day.other-month{color:var(--tx3);opacity:.5}
.cal-day-empty{cursor:default}
.cal-day-disabled{color:var(--tx3);opacity:.3;cursor:not-allowed}
.cal-shortcuts{display:flex;gap:5px;padding:8px 10px;border-top:1px solid var(--bd);flex-wrap:wrap}
.cal-sc{padding:3px 9px;border:1px solid var(--bd);background:none;color:var(--tx2);font-family:'DM Mono',monospace;font-size:9px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;transition:all .12s}
.cal-sc:hover{border-color:var(--ac);color:var(--ac);background:var(--glow)}
/* year/month picker */
.cal-ym-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px}
.cal-ym-btn{background:none;border:1px solid var(--bd);color:var(--tx2);font-family:'DM Mono',monospace;font-size:10px;padding:5px 2px;cursor:pointer;text-align:center;transition:all .12s;letter-spacing:.04em}
.cal-ym-btn:hover,.cal-ym-btn.on{border-color:var(--ac);color:var(--ac);background:var(--glow)}

/* ── BETTER FORM FIELDS ── */
.fi-currency{position:relative}
.fi-currency::before{content:'₹';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3);font-family:'DM Mono',monospace;font-size:11px;pointer-events:none}
.fi-currency .fi{padding-left:22px}
.fi-note{font-size:9px;color:var(--tx3);margin-top:3px;letter-spacing:.04em}
.fi-group{display:flex;gap:0}
.fi-group .fi{flex:1}
.fi-group-addon{padding:8px 11px;background:var(--sf2);border:1px solid var(--bdhi);border-left:none;color:var(--tx3);font-size:10px;display:flex;align-items:center;white-space:nowrap;letter-spacing:.04em}
.input-valid{border-color:var(--ac3)!important}
.input-error{border-color:var(--dng)!important}
.field-err{font-size:9px;color:var(--dng);margin-top:3px;letter-spacing:.04em;display:none}
.field-err.show{display:block}

/* peek improvements */
.peek-section-hd{font-family:'Syne',sans-serif;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--tx3);padding:10px 0 7px;border-bottom:1px solid var(--bd);margin-bottom:12px;display:flex;align-items:center;gap:9px}
.peek-section-hd::after{content:'';flex:1;height:1px;background:var(--bd)}
.fi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}


/* ── REMINDERS CALENDAR ──────────────────────────────────── */
.rem-wrap{background:var(--sf);border:1px solid var(--bdhi);overflow:hidden;margin-bottom:16px}
.rem-nav{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid var(--bd);background:var(--sf2)}
.rem-nav-title{font-family:'Syne',sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx);cursor:pointer;transition:color .12s}
.rem-nav-title:hover{color:var(--ac)}
.rem-nbtn{background:none;border:1px solid var(--bd);color:var(--tx2);width:27px;height:27px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.rem-nbtn:hover{border-color:var(--ac);color:var(--ac)}
.rem-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 10px 10px;gap:2px}
.rem-dname{font-size:9px;text-align:center;color:var(--tx3);padding:3px 0;font-family:'Syne',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.rem-day{min-height:52px;border:1px solid transparent;padding:4px;cursor:pointer;transition:all .12s;background:var(--sf2)}
.rem-day:hover{border-color:var(--bdhi);background:var(--bg)}
.rem-day.today{border-color:rgba(201,168,76,.4)}
.rem-day.otherm{opacity:.3}
.rem-dn{font-family:'DM Mono',monospace;font-size:10px;color:var(--tx2);margin-bottom:2px}
.rem-day.today .rem-dn{color:var(--ac);font-weight:500}
.rem-chip{font-size:9px;padding:1px 4px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rem-up-hd{font-family:'Syne',sans-serif;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--tx3);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.rem-up-hd::after{content:'';flex:1;height:1px;background:var(--bd)}
.rem-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--bd)}
.rem-row:last-child{border-bottom:none}
.rem-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rem-title{flex:1;font-size:11px;color:var(--tx)}
.rem-date{font-family:'DM Mono',monospace;font-size:9px;color:var(--tx3)}
.rem-amt{font-family:'DM Mono',monospace;font-size:10px;color:var(--ac);font-weight:500}
.rem-rec{font-size:8px;border:1px solid var(--bd);color:var(--tx3);padding:1px 5px;letter-spacing:.05em}
.ym-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px}
.ym-btn{background:none;border:1px solid var(--bd);color:var(--tx2);font-family:'DM Mono',monospace;font-size:10px;padding:5px 2px;cursor:pointer;text-align:center;transition:all .12s;letter-spacing:.04em}
.ym-btn:hover,.ym-btn.on{border-color:var(--ac);color:var(--ac);background:var(--glow)}
.cat-swatch-row{display:flex;gap:3px}
.cswatch{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:border-color .1s}
.cswatch.on{border-color:var(--tx)}

// ============================================================
// HELPERS
// ============================================================
function dL(d){ if(!d) return null; return Math.round((new Date(d) - Date.now()) / 86400000); }
function fP(n){ if(n == null || n === '') return '--'; return '\u20B9' + Number(n).toLocaleString('en-IN'); }
function fD(d){ if(!d) return '--'; try{ return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; } }
function sCol(s){ return s >= 75 ? 'var(--dng)' : s >= 50 ? '#fb8c00' : s >= 25 ? 'var(--ac)' : 'var(--ac3)'; }

function calcScore(row, sch) {
  var s = 0;
  if(row.status === 'Critical') s += 50; else if(row.status === 'Pending') s += 25;
  if(row.priority === 'Urgent') s += 35; else if(row.priority === 'High') s += 20; else if(row.priority === 'Medium') s += 8;
  if(sch && sch.dateCol) {
    var d = dL(row[sch.dateCol]);
    if(d != null){ if(d < 0) s += 30; else if(d <= 2) s += 25; else if(d <= 7) s += 15; else if(d <= 30) s += 5; }
  }
  return Math.min(s, 100);
}

function toast(msg, type) {
  var w = document.getElementById('toasts');
  var t = document.createElement('div');
  t.className = 'toast ' + (type === 'success' ? 'ok' : type === 'error' ? 'err' : 'inf');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(function(){
    t.style.opacity = '0'; t.style.transform = 'translateX(18px)'; t.style.transition = 'all .28s';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, 2800);
}

  }

  // Column inputs — smart types + calendar
  body.appendChild(mkEl('div','peek-section-hd','Entry Details'));
  sch.cols.forEach(function(c) {
    var isDateCol = c === sch.dateCol;
    var isFileCol = c === 'Files' || c === 'Warranty' || c.toLowerCase().indexOf('file') >= 0;
    var cap = c; // capture for closure
    if(isFileCol) {
      body.appendChild(makeDriveField(cap, form[cap], function(v){ form[cap] = v; }));
    } else if(isDateCol) {
      var dp = makeDatePicker(cap, form[cap] || '', function(v){ form[cap] = v; });
      body.appendChild(dp);

      body.appendChild(makeSmartField(cap, form[cap], function(v){ form[cap] = v; }));

  });

  // Status + Priority row
  var two = mkEl('div', 'fi2');
  two.appendChild(makeSelect('Status', form.status, Object.keys(STATUS), function(v){ form.status = v; }));
  two.appendChild(makeSelect('Priority', form.priority, Object.keys(PRIC), function(v){ form.priority = v; }));
  body.appendChild(two);

  // Schema reference
  var sb = mkEl('div', 'schema-box');
  sb.appendChild(mkEl('div', 'schema-hd', 'Notion Schema'));
  Object.keys(sch.notion).forEach(function(k){
    var row = mkEl('div', 'schema-row');
    var kk = mkEl('span', null, k); kk.style.color = 'var(--tx2)';
    var vv = mkEl('span', null, sch.notion[k]); vv.style.color = 'var(--ac2)';
    row.appendChild(kk); row.appendChild(vv);
    sb.appendChild(row);
  });
  body.appendChild(sb);

  // Save button
  var saveBtn = mkEl('button', 'btn pri', isNew ? '+ Add Entry' : 'Save Changes');
  saveBtn.style.cssText = 'width:100%;margin-top:16px';
  saveBtn.onclick = function() {
    var pk = sch.cols[0];
    var pkVal = (form[pk] || '').toString().trim();

    if(isNew) {
      var newRow = {id: Date.now(), status: form.status, priority: form.priority};
      sch.cols.forEach(function(c){ newRow[c] = form[c] || ''; });
      sch.rows.push(newRow);

      sch.rows = sch.rows.map(function(r){

        sch.cols.forEach(function(c){ updated[c] = form[c] || ''; });

      });
      saveData();

    }
    closePeek();
    renderPage();
    renderSidebar();
  };

  // Delete button (edit only)

    lines.push(allCols.map(function(c){ return JSON.stringify(row[c] == null ? '' : String(row[c])); }).join(','));

  var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);

  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

}

// ============================================================
// GLOBAL PULSE
// ============================================================
function renderPulse() {
  var all = [];
  SKEYS.forEach(function(k){ SCHEMA[k].rows.forEach(function(r){ all.push({r:r,k:k,sch:SCHEMA[k],sc:calcScore(r,SCHEMA[k])}); }); });
  all.sort(function(a,b){ return b.sc - a.sc; });
  var seen = {}, top = [];
  all.forEach(function(i){ if(!seen[i.k]) seen[i.k]=0; if(seen[i.k]<2){ top.push(i); seen[i.k]++; } });

  var totCrit = all.filter(function(i){ return i.r.status==='Critical'||i.r.priority==='Urgent'; }).length;
  var pending = all.filter(function(i){ return i.r.status==='Pending'; }).length;
  var overdue = all.filter(function(i){ return i.sch.dateCol && dL(i.r[i.sch.dateCol]) < 0; }).length;

  var frag = document.createDocumentFragment();
  var secH = mkEl('div', 'sec-hd');
  var hL = mkEl('div');
  hL.appendChild(mkEl('div', 'h1', 'Global Pulse'));
  hL.appendChild(mkEl('div', 'sub', 'Highest-criticality items across all ' + SKEYS.length + ' trackers'));
  secH.appendChild(hL); frag.appendChild(secH);

  var stats = mkEl('div', 'stats');
  [{l:'All Entries',v:all.length,c:'var(--ac)'},{l:'Critical',v:totCrit,c:'var(--dng)'},{l:'Pending',v:pending,c:'var(--ac)'},{l:'Overdue',v:overdue,c:'#fb8c00'}]
  .forEach(function(s){
    var cell = mkEl('div', 'stat');
    var n = mkEl('div', 'stat-n', s.v); n.style.color = s.c;
    cell.appendChild(n); cell.appendChild(mkEl('div', 'stat-l', s.l));
    stats.appendChild(cell);
  });
  frag.appendChild(stats);

  var grid = mkEl('div', 'pgrid');
  top.slice(0,12).forEach(function(item){
    var sch = item.sch; var tc = sch.cols[0];
    var days = sch.dateCol ? dL(item.r[sch.dateCol]) : null;
    var bCol = item.sc >= 75 ? 'var(--dng)' : item.sc >= 50 ? '#fb8c00' : 'var(--ac)';
    var card = mkEl('div', 'pcard');
    var bar = mkEl('div', 'pcard-bar'); bar.style.background = bCol; card.appendChild(bar);
    var icon = mkEl('div', 'p-icon', sch.icon); card.appendChild(icon);
    var info = mkEl('div');
    info.style.cssText = 'flex:1;min-width:0';
    info.appendChild(mkEl('div', 'p-meta', sch.label));
    info.appendChild(mkEl('div', 'p-name', String(item.r[tc] || '--')));
    if(days != null) {
      var due = mkEl('div', 'p-due', days<0?Math.abs(days)+'D OVERDUE':days===0?'DUE TODAY':days+'D LEFT');
      due.style.color = days<0?'var(--dng)':days<=7?'#fb8c00':'var(--tx3)';
      info.appendChild(due);
    }
    card.appendChild(info);
    var right = mkEl('div'); right.style.cssText = 'display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0';
    right.appendChild(Badge(item.r.status));
    var sn = mkEl('span', null, item.sc); sn.style.cssText = 'font-size:11px;font-weight:500;color:'+sCol(item.sc)+';letter-spacing:.04em';
    right.appendChild(sn); card.appendChild(right);
    grid.appendChild(card);
  });
  frag.appendChild(grid);
  return frag;
}

  var total = sch.priceCol ? sch.rows.reduce(function(s,r){ return s+Number(r[sch.priceCol]||0); },0) : null;

  var frow = mkEl('div', 'frow');
  var searchInp = mkEl('input', 'fin');
  searchInp.type = 'text'; searchInp.value = S.search[key] || '';
  searchInp.placeholder = 'Search ' + sch.label.toLowerCase() + '...';
  searchInp.oninput = function(){ S.search[key] = searchInp.value; renderPage(); };
  frow.appendChild(searchInp);
  var sfSel = mkEl('select', 'fsel');
  ['All'].concat(Object.keys(STATUS)).forEach(function(st){
    var o = document.createElement('option'); o.value=st; o.textContent=st;
    if((S.sf[key]||'All')===st) o.selected=true;
    sfSel.appendChild(o);
  });
  sfSel.onchange = function(){ S.sf[key] = sfSel.value; renderPage(); };
  frow.appendChild(sfSel); frag.appendChild(frow);

  // Table
  var wrap = mkEl('div', 'tbl-wrap');
  var scroll = mkEl('div', 'tbl-scroll');
  var tbl = document.createElement('table');
  var thead = mkEl('thead'); var hr = mkEl('tr');
  sch.cols.forEach(function(c){ hr.appendChild(mkEl('th', null, c)); });
  hr.appendChild(mkEl('th', null, 'Status')); hr.appendChild(mkEl('th', null, 'Score'));
  thead.appendChild(hr); tbl.appendChild(thead);

  var tbody = mkEl('tbody');
  if(!filtered.length) {
    var eRow = mkEl('tr'); var eTd = mkEl('td', null, 'No entries');
    eTd.colSpan = sch.cols.length + 2;
    eTd.style.cssText = 'text-align:center;padding:30px;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase;font-size:10px';
    eRow.appendChild(eTd); tbody.appendChild(eRow);
  } else {
    filtered.forEach(function(row){
      var sc = calcScore(row, sch);
      var tr = mkEl('tr');
      if(sc >= 75) tr.style.background = 'rgba(255,76,107,.03)';
      else if(sc >= 50) tr.style.background = 'rgba(251,140,0,.02)';
      // Capture for closure
      var capturedKey = key; var capturedId = row.id;
      tr.onclick = function(){ openPeek(capturedKey, capturedId); };

      sch.cols.forEach(function(c){
        var td = mkEl('td');
        if(c === sch.dateCol) {
          var d = dL(row[c]);
          var dv = mkEl('div', 'hi', fD(row[c]));
          if(d != null && d < 0) dv.style.color = 'var(--dng)';
          td.appendChild(dv);
          if(d != null) {
            var ds = mkEl('div', null, d<0?Math.abs(d)+'d overdue':d===0?'TODAY':d+'d left');
            ds.style.cssText = 'font-size:9px;margin-top:1px;text-transform:uppercase;color:' + (d<0?'var(--dng)':d<=7?'#fb8c00':'var(--tx3)');
            td.appendChild(ds);
          }
        } else if(c === sch.priceCol) {
          var pv = mkEl('span', 'hi', fP(row[c])); pv.style.color = 'var(--ac)'; td.appendChild(pv);
        } else if(c === 'Files' || c === 'Warranty' || c.toLowerCase().indexOf('file') >= 0) {
          td.onclick = function(e){ e.stopPropagation(); };
          var fv = row[c] ? row[c].trim() : '';
          if(fv) {
            var lnk = mkEl('span', null, '\u25A6 Link');
            lnk.style.cssText = 'font-size:10px;color:var(--ac2);cursor:pointer;border:1px solid var(--ac2);padding:2px 7px;letter-spacing:.04em';
            lnk.onclick = function(){ window.open(fv,'_blank'); };
            td.appendChild(lnk);
          } else { td.appendChild(mkEl('span', null, '--')); }
        } else {
          var clip = mkEl('span', 'clip hi', String(row[c] || '--'));
          td.appendChild(clip);
        }
        tr.appendChild(td);
      });

      var statusTd = mkEl('td');
      var badgeWrap = mkEl('div'); badgeWrap.style.cssText = 'display:flex;flex-direction:column;gap:4px';
      badgeWrap.appendChild(Badge(row.status)); badgeWrap.appendChild(PriChip(row.priority));
      statusTd.appendChild(badgeWrap); tr.appendChild(statusTd);
      var scoreTd = mkEl('td'); scoreTd.appendChild(ScoreBar(sc)); tr.appendChild(scoreTd);
      tbody.appendChild(tr);
    });
  }
  tbl.appendChild(tbody); scroll.appendChild(tbl); wrap.appendChild(scroll);
  frag.appendChild(wrap);
  return frag;
}

  return frag;

var MN_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var PRESET_COLORS_REM = ['#fbbf24','#60a5fa','#4ade80','#f87171','#a78bfa','#2dd4bf','#f97316','#e879f9','#94a3b8'];

function remColor(catId){
  var c=REM_CATS.filter(function(x){return x.id===catId;})[0];
  return c?c.color:'#7a7a90';
}
function remCatName(catId){
  var c=REM_CATS.filter(function(x){return x.id===catId;})[0];
  return c?c.name:catId;
}
function remExpand(yr,mo){
  var out=[];
  REM_EVENTS.forEach(function(ev){
    var d=new Date(ev.date+'T00:00:00');
    if(ev.rec==='monthly'){
      var iso=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      out.push(Object.assign({},ev,{date:iso,_orig:ev.id}));
    } else if(ev.rec==='yearly'){
      if(d.getMonth()===mo){
        var iso2=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        out.push(Object.assign({},ev,{date:iso2,_orig:ev.id}));
      }
    } else {
      if(d.getFullYear()===yr&&d.getMonth()===mo) out.push(ev);
    }
  });
  return out;
}

// ============================================================
// PERSISTENCE — localStorage auto-save/load
// ============================================================
var STORAGE_KEY = 'lume_v1';

function saveData() {
  try {
    var payload = {version:3,savedAt:new Date().toISOString(),trackers:{},services:{cats:SVC.cats,items:SVC.items},reminders:{events:REM_EVENTS,cats:REM_CATS}};
    SKEYS.forEach(function(k){ payload.trackers[k] = SCHEMA[k].rows; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch(e) { console.warn('Lume: could not save to localStorage', e); }
}

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    var d = JSON.parse(raw);
    if(!d || !d.trackers) return false;
    SKEYS.forEach(function(k){ if(d.trackers[k] && Array.isArray(d.trackers[k])) SCHEMA[k].rows = d.trackers[k]; });
    if(d.services){
      if(d.services.cats&&Array.isArray(d.services.cats))SVC.cats=d.services.cats;
      if(d.services.items&&Array.isArray(d.services.items))SVC.items=d.services.items;
    }
    if(d.reminders){
      if(d.reminders.events&&Array.isArray(d.reminders.events))REM_EVENTS=d.reminders.events;
      if(d.reminders.cats&&Array.isArray(d.reminders.cats))REM_CATS=d.reminders.cats;
    }
    return true;
  } catch(e) { console.warn('Lume: could not load from localStorage', e); return false; }
}

function clearData() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

function makeDatePicker(labelTxt, initialVal, onChange) {
  // Parse initial value
  var cur = initialVal ? new Date(initialVal + 'T00:00:00') : new Date();
  if(isNaN(cur.getTime())) cur = new Date();
  var viewYear  = cur.getFullYear();
  var viewMonth = cur.getMonth();
  var selDate   = initialVal ? initialVal : null; // 'YYYY-MM-DD' or null
  var viewMode  = 'days'; // 'days' | 'months' | 'years'

  var wrap = mkEl('div', 'fg cal-wrap');
  wrap.appendChild(mkEl('span', 'fl', labelTxt));

  var inputRow = mkEl('div', 'cal-input-row');
  var textInp = mkEl('input', 'cal-text');
  textInp.type = 'text';
  textInp.value = selDate ? formatDateDisplay(selDate) : '';
  textInp.placeholder = 'DD Mon YYYY — or type YYYY-MM-DD';
  textInp.autocomplete = 'off';

  var calBtn = mkEl('button', 'cal-btn');
  calBtn.type = 'button';
  calBtn.innerHTML = '&#128197;';
  calBtn.title = 'Pick date';

  inputRow.appendChild(textInp);
  inputRow.appendChild(calBtn);
  wrap.appendChild(inputRow);

  // Popup
  var popup = mkEl('div', 'cal-popup hidden');
  wrap.appendChild(popup);

  function formatDateDisplay(iso) {
    // iso = YYYY-MM-DD
    try {
      var d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
    } catch(e) { return iso; }
  }
  function toISO(d) {
    var m = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + dd;
  }
  function selectDate(iso) {
    selDate = iso;
    textInp.value = formatDateDisplay(iso);
    textInp.classList.add('input-valid');
    onChange(iso);
    closePopup();
  }
  function closePopup() { popup.classList.add('hidden'); }
  function openPopup()  { popup.classList.remove('hidden'); renderCal(); }

  // Parse typed text
  textInp.addEventListener('blur', function() {
    var v = textInp.value.trim();
    if(!v) { selDate = null; onChange(''); return; }
    // Try YYYY-MM-DD
    if(/^\d{4}-\d{2}-\d{2}$/.test(v)) {
      var d = new Date(v + 'T00:00:00');
      if(!isNaN(d.getTime())) { selectDate(v); viewYear=d.getFullYear(); viewMonth=d.getMonth(); return; }
    }
    // Try natural: "15 Jun 2025" or "15/06/2025"
    var d2 = new Date(v);
    if(!isNaN(d2.getTime())) { selectDate(toISO(d2)); return; }
    textInp.classList.add('input-error');
  });
  textInp.addEventListener('focus', function() {
    textInp.classList.remove('input-valid', 'input-error');
  });

  calBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if(popup.classList.contains('hidden')) openPopup(); else closePopup();
  });
  document.addEventListener('click', function(e) {
    if(!wrap.contains(e.target)) closePopup();
  });

  function renderCal() {
    popup.innerHTML = '';
    if(viewMode === 'months') { renderMonthPicker(); return; }
    if(viewMode === 'years')  { renderYearPicker();  return; }

    // Nav bar
    var nav = mkEl('div', 'cal-nav');
    var prevBtn = mkEl('button', 'cal-nav-btn', '<');
    prevBtn.onclick = function() { viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} renderCal(); };
    var lbl = mkEl('div', 'cal-month-lbl', CAL_MONTHS[viewMonth] + ' ' + viewYear);
    lbl.onclick = function() { viewMode='months'; renderCal(); };
    var nextBtn = mkEl('button', 'cal-nav-btn', '>');
    nextBtn.onclick = function() { viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} renderCal(); };
    nav.appendChild(prevBtn); nav.appendChild(lbl); nav.appendChild(nextBtn);
    popup.appendChild(nav);

    var grid = mkEl('div', 'cal-grid');
    var dayNames = mkEl('div', 'cal-day-names');
    CAL_DAYS.forEach(function(d){ dayNames.appendChild(mkEl('div','cal-day-name',d)); });
    grid.appendChild(dayNames);

    var days = mkEl('div', 'cal-days');
    var firstDay = new Date(viewYear, viewMonth, 1).getDay();
    var daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    var today = toISO(new Date());

    // Leading blanks
    for(var i=0; i<firstDay; i++) {
      var blank = mkEl('button','cal-day cal-day-empty',' '); blank.disabled=true;
      days.appendChild(blank);
    }
    for(var d=1; d<=daysInMonth; d++) {
      var iso = viewYear + '-' + String(viewMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var cls = 'cal-day';
      if(iso === today) cls += ' today';
      if(iso === selDate) cls += ' selected';
      var btn = mkEl('button', cls, d);
      btn.setAttribute('data-iso', iso);
      btn.onclick = (function(i){ return function(){ selectDate(i); }; })(iso);
      days.appendChild(btn);
    }
    grid.appendChild(days);
    popup.appendChild(grid);

    // Shortcuts
    var sc = mkEl('div', 'cal-shortcuts');
    var shortcuts = [
      {l:'Today', fn:function(){ selectDate(toISO(new Date())); }},
      {l:'+7d',   fn:function(){ var d=new Date(); d.setDate(d.getDate()+7); selectDate(toISO(d)); }},
      {l:'+1mo',  fn:function(){ var d=new Date(); d.setMonth(d.getMonth()+1); selectDate(toISO(d)); }},
      {l:'+3mo',  fn:function(){ var d=new Date(); d.setMonth(d.getMonth()+3); selectDate(toISO(d)); }},
      {l:'+1yr',  fn:function(){ var d=new Date(); d.setFullYear(d.getFullYear()+1); selectDate(toISO(d)); }},
      {l:'Clear',  fn:function(){ selDate=null; textInp.value=''; onChange(''); closePopup(); }}
    ];
    shortcuts.forEach(function(s){
      var b = mkEl('button','cal-sc',s.l); b.onclick=s.fn; sc.appendChild(b);
    });
    popup.appendChild(sc);
  }

  function renderMonthPicker() {
    var nav = mkEl('div', 'cal-nav');
    var prevBtn = mkEl('button','cal-nav-btn','<'); prevBtn.onclick=function(){ viewYear--; renderCal(); };
    var lbl = mkEl('div','cal-month-lbl',String(viewYear));
    lbl.onclick = function(){ viewMode='years'; renderCal(); };
    var nextBtn = mkEl('button','cal-nav-btn','>'); nextBtn.onclick=function(){ viewYear++; renderCal(); };
    nav.appendChild(prevBtn); nav.appendChild(lbl); nav.appendChild(nextBtn);
    popup.appendChild(nav);
    var g = mkEl('div','cal-ym-grid');
    CAL_MONTHS.forEach(function(m,i){
      var b = mkEl('button','cal-ym-btn'+(i===viewMonth?' on':''),m.slice(0,3));
      b.onclick = (function(mi){ return function(){ viewMonth=mi; viewMode='days'; renderCal(); }; })(i);
      g.appendChild(b);
    });
    popup.appendChild(g);
  }

  function renderYearPicker() {
    var startYear = Math.floor(viewYear/10)*10 - 5;
    var nav = mkEl('div','cal-nav');
    var prevBtn = mkEl('button','cal-nav-btn','<'); prevBtn.onclick=function(){ startYear-=12; renderYearRange(startYear); };
    var lbl = mkEl('div','cal-month-lbl',startYear+' – '+(startYear+11));
    var nextBtn = mkEl('button','cal-nav-btn','>'); nextBtn.onclick=function(){ startYear+=12; renderYearRange(startYear); };
    nav.appendChild(prevBtn); nav.appendChild(lbl); nav.appendChild(nextBtn);
    popup.appendChild(nav);
    renderYearRange(startYear);
    function renderYearRange(sy){
      popup.innerHTML='';popup.appendChild(nav);
      lbl.textContent = sy+' – '+(sy+11);
      var g=mkEl('div','cal-ym-grid');
      for(var y=sy; y<sy+12; y++){
        var yr=y;
        var b=mkEl('button','cal-ym-btn'+(yr===viewYear?' on':''),yr);
        b.onclick=(function(yy){return function(){viewYear=yy;viewMode='months';renderCal();};})(yr);
        g.appendChild(b);
      }
      popup.appendChild(g);
    }
  }

  if(selDate) {
    var d = new Date(selDate + 'T00:00:00');
    if(!isNaN(d.getTime())){ viewYear=d.getFullYear(); viewMonth=d.getMonth(); }
  }
  return wrap;
}

// ── SMART INPUT TYPES ────────────────────────────────────────────────────────
function makeSmartField(col, val, onChange) {
  var lc = col.toLowerCase();
  // Currency / price fields
  if(lc === 'price' || lc === 'cost' || lc.indexOf('price') >= 0 || lc === 'points' || lc.indexOf('reward') >= 0) {
    var g = mkEl('div','fg');
    g.appendChild(mkEl('span','fl',col));
    var cw = mkEl('div','fi-currency');
    var inp = mkEl('input','fi');
    inp.type = 'number'; inp.value = val || ''; inp.placeholder = '0';
    inp.min = '0'; inp.step = '1';
    inp.style.paddingLeft = '22px';
    inp.oninput = inp.onchange = function(){ onChange(inp.value); };
    cw.appendChild(inp); g.appendChild(cw);
    g.appendChild(mkEl('div','fi-note','Amount in \u20B9 (Indian Rupees)'));
    return g;
  }
  // Phone fields
  if(lc === 'phone' || lc.indexOf('phone') >= 0 || lc.indexOf('contact') >= 0 || lc.indexOf('number') >= 0) {
    var g2 = mkEl('div','fg');
    g2.appendChild(mkEl('span','fl',col));
    var inp2 = mkEl('input','fi');
    inp2.type = 'tel'; inp2.value = val || ''; inp2.placeholder = '+91 98765 43210';
    inp2.oninput = inp2.onchange = function(){ onChange(inp2.value); };
    g2.appendChild(inp2);
    return g2;
  }
  // Mileage / reading / numeric
  if(lc === 'mileage' || lc === 'reading') {
    var g3 = mkEl('div','fg');
    g3.appendChild(mkEl('span','fl',col));
    var row3 = mkEl('div','fi-group');
    var inp3 = mkEl('input','fi'); inp3.type='number'; inp3.value=val||''; inp3.placeholder='0'; inp3.step='0.1';
    inp3.oninput=inp3.onchange=function(){onChange(inp3.value);};
    var addon3 = mkEl('div','fi-group-addon', lc==='mileage'?'km/L':'km');
    row3.appendChild(inp3); row3.appendChild(addon3);
    g3.appendChild(row3);
    return g3;
  }
  // Description / notes (multi-line)
  if(lc === 'description' || lc === 'notes' || lc === 'address' || lc.indexOf('desc') >= 0) {
    var g4 = mkEl('div','fg');
    g4.appendChild(mkEl('span','fl',col));
    var ta = document.createElement('textarea');
    ta.className = 'fi'; ta.value = val || ''; ta.placeholder = col;
    ta.rows = 3; ta.style.resize = 'vertical'; ta.style.fontFamily = 'DM Mono,monospace';
    ta.oninput = ta.onchange = function(){ onChange(ta.value); };
    g4.appendChild(ta);
    return g4;
  }
  // Relation / Utility (short select-like text with suggestions)
  if(lc === 'relation' || lc === 'utility') {
    var g5 = mkEl('div','fg');
    g5.appendChild(mkEl('span','fl',col));
    var inp5 = mkEl('input','fi');
    inp5.type = 'text'; inp5.value = val || ''; inp5.placeholder = col;
    var suggestions = lc === 'relation' ? ['Finance','Legal','Medical','Family Doctor','Housing','Emergency','Work'] : ['Plumbing','Electrical','Pest Control','Internet','Carpentry','Painting','HVAC','Security'];
    var list = document.createElement('datalist');
    list.id = 'dl-' + lc + '-' + Date.now();
    suggestions.forEach(function(s){ var opt=document.createElement('option'); opt.value=s; list.appendChild(opt); });
    inp5.setAttribute('list', list.id);
    inp5.oninput = inp5.onchange = function(){ onChange(inp5.value); };
    g5.appendChild(inp5); g5.appendChild(list);
    return g5;
  }
  // Default text
  var gd = mkEl('div','fg');
  gd.appendChild(mkEl('span','fl',col));
  var inpd = mkEl('input','fi');
  inpd.type = 'text'; inpd.value = val || ''; inpd.placeholder = col;
  inpd.oninput = inpd.onchange = function(){ onChange(inpd.value); };
  gd.appendChild(inpd);
  return gd;
}

// ============================================================
// MOBILE SIDEBAR DRAWER
// ============================================================
function toggleSidebar(){
  var sb = document.getElementById('sidebar');
  var scrim = document.getElementById('sbScrim');
  var open = sb.classList.toggle('open');
  scrim.classList.toggle('on', open);
}
function closeSidebarMobile(){
  if(window.innerWidth > 768) return;
  var sb = document.getElementById('sidebar');
  var scrim = document.getElementById('sbScrim');
  sb.classList.remove('open');
  scrim.classList.remove('on');
}
document.getElementById('sbScrim').addEventListener('click', closeSidebarMobile);

// ============================================================
// BOOT — load persisted data first, then render
// ============================================================
var _loaded = loadData();
renderSidebar();
renderTopbar();
renderPage();
if(_loaded) toast('Data loaded from last session', 'success');

// ============================================================
// PWA: SERVICE WORKER REGISTRATION + INSTALL PROMPT
// ============================================================
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
var _deferredInstall = null;
window.addEventListener('beforeinstallprompt', function(ev){
  ev.preventDefault();
  _deferredInstall = ev;
  var btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'inline-flex';
});
window.addEventListener('appinstalled', function(){
  var btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'none';
});
function installApp(){
  if(!_deferredInstall){ toast('Use browser menu \u2192 Add to Home Screen','info'); return; }
  _deferredInstall.prompt();
  _deferredInstall.userChoice.then(function(){
    _deferredInstall = null;
    var btn = document.getElementById('installBtn');
    if(btn) btn.style.display = 'none';
  });
}
